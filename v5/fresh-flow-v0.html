   <span style=${{color:"var(--text-muted)"}}>${row.day}</span>
   ${M.kinds.map(function(k){return FV._html`<${FV.OpportunityCell} cell=${row.cells[k]} best=${M.best[k]} />`;})}

    value=${c.gain>0?((c.x===0?"계약 없음":("+"+c.x+"t"))):"지금 선택이 최선"}
    note=${c.gain>0?("+"+mo(c.gain)):(c.mine===0?"계약 없음":("+"+c.mine+"t"))} />`;

FV.OpportunityAnalysis=function(props){
 var M=props.matrix;
 if(!M)return FV._html`<div style=${{fontSize:"12px",color:"var(--text-secondary)"}}>더 살 날이 없다.</div>`;
 var COL="14% "+M.kinds.map(function(){return "1fr"}).join(" ");
 return FV._html`
  <${FV._F}>
   <div style=${{fontSize:"11px",color:"var(--text-muted)",lineHeight:"1.6",marginBottom:"6px"}}>
    그날 하나를 더 샀을 때의 현금 차이<br />
    · 유지비만큼 변함 (입고 ${M.maint.intake} / 판매 ${M.maint.sales})
   </div>
   <div style=${{display:"grid",gridTemplateColumns:COL,gap:"8px",fontSize:"11px",padding:"4px 0",borderBottom:"0.5px solid var(--border)"}}>
    <span style=${{color:"var(--text-muted)"}}>일</span>
    ${M.kinds.map(function(k){return FV._html`<span style=${{textAlign:"right",color:"var(--text-secondary)"}}>${FV.lblOf(k)}</span>`;})}
   </div>
   ${M.rows.map(function(row){return FV._html`<${FV.OpportunityRow} matrix=${M} row=${row} columns=${COL} />`;})}
  <//>`;
};


FV.finBriefNode=function(){
 if(!FF.finDayOf())return null;
 return FV._html`
  <${FV.StatRow}
   label="운영 종료"
   value=${FF.finDayOf()+"일차"}
   note=${(FF.finDayOf()+1)+"~"+FF.C.days+"일 자동 운영"}

}

FV.finAfterNode=function(){
 var a=FF.finAfterTop();
 if(!a||a.state==="same")return null;
 if(a.state==="none")return FV._html`
  <${FV.StatRow} label="종료 후 기회" value="없음" note="접은 뒤로는 이득 없음" />`;
 return FV._html`
  <${FV.StatRow}
   label="종료 후 최대 기회"
   value=${a.day+"일 "+FV.lblOf(a.kind)}
   note=${"+"+mo(a.gain)}
  />`;
}

FV.missedBriefNode=function(){
 var t=FF.missedTop();
 if(!t)return FV._html`
  <${FV.StatRow} label="놓친 최대 기회" value="없음" note="어느 날 더 사도 늘지 않음" />`;
 var a=FF.finAfterTop();
 var ctx=(a&&a.state==="same")?"운영 종료 이후":(a&&a.state==="other")?"운영 종료 전":"";
 var span=t.spread?(t.spanFrom+"~"+t.spanTo+"일"):(t.day+"일");
 return FV._html`
  <${FV._F}>
   <${FV.StatRow}
    label="놓친 최대 기회"
    value=${t.day+"일 "+FV.lblOf(t.kind)}
    note=${"+"+mo(t.gain)}
   />
   <${FV.StatRow} label="유효 구간" value=${span} note=${ctx} />
  <//>`;
}

FV.contribNode=function(){
 var rows=FF.contribRows();
 if(!rows.length)return null;
 return FV._html`

    <div style=${{display:"flex",justifyContent:"space-between",padding:"3px 0",fontSize:"13px"}}>

FV.RelPortfolioView=function(){

 return FV._html`
  <div style=${{fontSize:"12px",color:"var(--text-secondary)",padding:"4px 0"}}>
   <div>${r.day}일 ${lbl} · ${r.days}일 보유</div>
   <div style=${{paddingLeft:"10px"}}>
    추가 용량 사용 ${Math.round(r.extra)}t (여력의 ${Math.round(r.fill*100)}%) · 들인 돈 ${mo(r.cost)} ·
    <span style=${{color:r.contrib>=0?"var(--text-success)":"var(--text-warning)"}}>

FV.InvestmentAnalysis=function(props){
 var rows=props.rows||[];

   <div style=${{fontSize:"12px",color:"var(--text-muted)",margin:"0 0 6px"}}>
    기여는 그 설비 하나만 빼고 30일을 다시 돌린 결과와의 차이다. 설비끼리 영향을 주므로 합계는 전체 차이와 다르다.

FV.FullLog=function(){
 return FV._html`
  <${FV._F}>
   <${FV.TimelineLog} items=${FF.timelineOf()} />

   <${FV.BuyLog} rows=${FF.buylogOf()} />

FV.BuyLog=function(props){
 var BL=props.rows||[];
 if(!BL.length)return FV._html`<div style=${{color:"var(--text-muted)",marginTop:"12px"}}>이번 판에는 아무것도 사지 않았다.</div>`;
 var COL="repeat(8,minmax(0,1fr))";
 var HEAD=["일차","설비","몇 번째","앞으로","최근","가동","남은 날","계기"];
 var grid=function(extra){return Object.assign({display:"grid",gridTemplateColumns:COL,gap:"4px",borderBottom:"0.5px solid var(--border)"},extra)};
 return FV._html`
  <${FV._F}>
   <div style=${{marginTop:"14px",fontSize:"12px",color:"var(--text-muted)"}}>증설 기록</div>
   <div style=${grid({fontSize:"11px",padding:"5px 0",color:"var(--text-muted)"})}>
    ${HEAD.map(function(x){return FV._html`<span>${x}</span>`;})}
   </div>
   ${BL.map(function(b){return FV._html`
    <div style=${grid({fontSize:"12px",padding:"4px 0",color:"var(--text-primary)"})}>
     <span>${b.day}</span><span>${FV.lblOf(b.kind)}</span><span>${b.nth}회</span>
     <span>${FV.trendWord(b.gap)}</span><span>${b.kind==="contract"?"개장 전망":(b.hitLen<3?("관측 "+b.hitLen+"일"):(b.hitLen+"일 중 "+b.hitN+"일"))}</span>
     <span>${b.util===null?"—":(b.util+"%")}</span><span>${b.left}일</span><span>${FV.say("path",b.path)}</span>
    </div>`;})}
   <button id="kcopy" style=${{width:"100%",padding:"9px",fontSize:"12px",marginTop:"10px"}} onClick=${function(){FV.copyLog()}}>기록 복사</button>
   <textarea id="kdump" readonly style=${{width:"100%",height:"0",opacity:"0",border:"0",padding:"0"}}></textarea>
  <//>`;
};

FV.TimelineLog=function(props){
 var TL=props.items||[];
 if(!TL.length)return null;
 var sayBuy=function(t){
  return (t.kind==="contract")
   ? ("초과분 매입 계약 · 한도 넘는 날 "+t.newCap+"t 더 받는다")
   : ("판매 한도 늘리기 · 다음날 "+t.newCap+"t/일 적용");
 };
 var byDay={};
 TL.forEach(function(t){
  var k2="d"+t.day;
  if(!byDay[k2])byDay[k2]={sort:t.day+0.5,kind:"day",day:t.day,ev:[],act:[]};
  if(t.type==="event")byDay[k2].ev.push(FV.EVENT_TEXT[t.b]||"");
  else if(t.type==="buy")byDay[k2].act.push(sayBuy(t));
  else if(t.type==="finish")byDay[k2].act.push("운영 종료 선택, 남은 기간 자동 운영");
 });
 var arr=Object.keys(byDay).map(function(k){return byDay[k]}).sort(function(a,b){return a.sort-b.sort});
 return FV._html`
  <div style=${{fontSize:"12px",lineHeight:"1.7"}}>
   <div style=${{fontSize:"12px",color:"var(--text-muted)",marginBottom:"6px"}}>진행 기록</div>
   ${arr.map(function(r){
    if(r.kind==="auto")return FV._html`<div style=${{color:"var(--text-muted)",padding:"3px 0"}}>${r.text}</div>`;
    return FV._html`
     <div style=${{display:"flex",gap:"8px",padding:"3px 0"}}>
      <span style=${{width:"34px",color:"var(--text-secondary)",flexShrink:"0"}}>${r.day}일</span>
      <span style=${{flex:"1"}}>
       ${r.ev.length?FV._html`<span style=${{color:"var(--text-warning)"}}>${r.ev.join(", ")}</span>`:null}
       ${r.ev.length&&r.act.length?" → ":null}
       ${r.act.length?FV._html`<span style=${{color:"var(--text-primary)"}}>${r.act.join(", ")}</span>`:null}
      </span>
     </div>`;
   })}
  </div>`;
};

FV.DailyLog=function(props){
 var rows=props.rows||[];
 var HEAD=["일차","생산","수요","판매","미입고","상함","못판수요","손익"];
 var grid={display:"grid",gridTemplateColumns:"repeat(8,minmax(0,1fr))",gap:"2px",fontSize:"11px"};
 if(!rows.length)return FV._html`<div style=${{color:"var(--text-muted)"}}>하루를 운영하면 결과가 쌓인다.</div>`;
 var cell=function(v,right,color){var st={};if(right)st.textAlign="right";if(color)st.color=color;return FV._html`<span style=${st}>${v}</span>`};
 return FV._html`
  <${FV._F}>
   <div style=${Object.assign({},grid,{padding:"4px 0",borderBottom:"0.5px solid var(--border)"})}>
    ${HEAD.map(function(h,i){return cell(h,i>0);})}
   </div>
   ${rows.map(function(r){return FV._html`
    <div style=${Object.assign({},grid,{padding:"3px 0",borderBottom:"0.5px solid var(--border)",color:"var(--text-primary)"})}>
     ${cell(String(r.day),false)}${cell(FF.fInt(r.prod),true)}${cell(FF.fInt(r.dem),true)}${cell(FF.fInt(r.sold),true)}
     ${cell(FF.fInt(r.wI+r.wS),true)}${cell(FF.fInt(r.wT),true)}${cell(FF.fInt(r.missed),true)}
     ${cell(mo(r.profit),true,r.profit>=0?"var(--text-success)":"var(--text-danger)")}
    </div>`;})}
  <//>`;
};


})(window.FF,window.FV);
</script>
<script id="src-clip">
(function(FF,FV){
// 클립보드 조작. 화면 계층에서 DOM 을 만지는 유일한 곳이다.
FV.copyLog=function(){
 var S=FF.status(), B=FF.buysOf();
 var lines=["seed "+S.seed+" 현금 "+Math.round(S.cash)+" 입고 "+B.intake+"회 판매 "+B.sales,
  "일차\t설비\t몇 번째\t앞으로\t최근\t가동\t남은 날\t계기"];
 var BL=FF.buylogOf();
 for(var i=0;i<BL.length;i++){var b=BL[i];
  lines.push(b.day+"\t"+FV.lblOf(b.kind)+"\t"+b.nth+"\t"+FV.trendWord(b.gap)+"\t"+(b.hitLen<3?("관측"+b.hitLen+"일"):(b.hitLen+"일중"+b.hitN+"일"))+"\t"+b.util+"%\t"+b.left+"\t"+FV.say("path",b.path))}
 var txt=lines.join("\n");
 FF.LASTDUMP=txt;
 try{if(navigator&&navigator.clipboard)navigator.clipboard.writeText(txt)}catch{}
 var ta=document.getElementById("kdump");
 if(ta){ta.style.height="120px";ta.style.opacity="1";ta.value=txt;
  try{ta.select();ta.setSelectionRange(0,txt.length);document.execCommand("copy")}catch{}}
 var b2=document.getElementById("kcopy");
 if(b2)b2.textContent="복사됨. 안 되면 아래 상자를 길게 눌러 선택한다";
}
})(window.FF,window.FV);
</script>
<script id="src-view">
(function(FF,FV){

 if(!d)return FV._html`<div id="kbn" class="sub-p"></div>`;
 // 병목 표시는 실제로 뭔가 놓쳤을 때만 쓴다. 수요가 적어 여력이 남은 날은 정상 상태이지 장애가 아니다.
 var lost=FF.isLossCause(d.b);
 return FV._html`

   <span style=${{fontSize:"12px",color:"var(--text-muted)"}}>${lost?"어제 막힌 곳":"어제 상태"}</span><br />
   <span style=${{color:lost?"var(--text-warning)":"var(--text-secondary)"}}>${FV.BL[d.b]}</span><br />
   <span style=${{fontSize:"12px",color:"var(--text-secondary)"}}>${FV.causeLine(d)}</span><br />
   <span style=${{fontSize:"12px",color:"var(--text-secondary)"}}>실제 입고 ${FF.fInt(d.acc)}t · 생산 ${FF.fInt(d.prod)}t</span>

FV.IssueBar=function(){
 FF.observe();
 if(FF.isOver())return null;
 var P=FF.issuePlan();
 if(!P.signals.length&&!P.issues.length)return null;
 var chName=function(i){return FV.say("channel",FF.C.channels[i].key)};
 var relWord=function(v){return FV.say("relword",String(v))};
 var sigRows=P.signals.map(function(s){
  return FV._h("div",{class:"sig sig-"+s.type},
   chName(s.i)+" "+FV.say("signal",s.type)+" · "+relWord(s.from)+" → "+relWord(s.to));
 });
 var issueRows=P.issues.map(function(is){
  var accepted=is.resolution==="accepted";
  return FV._h("div",{class:"issue"+(accepted?" issue-accepted":"")},[
   FV._h("div",{class:"issue-head"},
    chName(is.i)+" 정책: "+FV.say("stance",String(is.level))+" · "+is.days+"일째 · 현재 "+relWord(is.rel)),
   FV._h("div",{class:"issue-nums"},
    "예상 판매 "+FF.fInt(is.preview)+"t · 관계 유지 기준 "+FF.fInt(is.quota)+"t"),
   FV._h("div",{class:"issue-verdict"},FV.say("feasible",is.feasible)),
   accepted
    ?FV._h("span",{class:"issue-ack"},"의도적 포기")
    :FV._h("button",{class:"issue-btn",onClick:function(){FF.acceptIssue(is.i)}},"포기")
  ]);
 });
 return FV._h("div",{id:"kissue",class:"issuebar"},sigRows.concat(issueRows));
}

FV.ChannelBar=function(){
 FF.observe();
 if(FF.isOver())return null;
 var P=FF.stancePlan(), IP=FF.issuePlan();
 var issueOf=function(i){
  for(var k=0;k<IP.issues.length;k++)if(IP.issues[k].i===i)return IP.issues[k];
  return null;
 };
 var STANCE_LEVELS=[0,1,2,3];
 // 라벨과 값을 같은 순서, 같은 칸 너비로 둔다. 판로 셋을 나란히 봤을 때 같은 줄끼리 비교되게 하기 위해서다.
 var kv=function(label,value,extraClass){
  return FV._h("div",{class:"chan-kv"+(extraClass?(" "+extraClass):"")},[
   FV._h("span",{class:"chan-kv-label"},label), " ",
   FV._h("span",{class:"chan-kv-value"},value)
  ]);
 };
 // 판단 위계 순서: 관계(장기 전략) -> 배정/주문(정책의 결과) -> 가격/최대/보장(판단 근거) -> 정책 버튼.
 var rows=P.rows.map(function(r,i){
  var issue=issueOf(i);
  var statusTxt=issue?(" · "+(issue.resolution==="accepted"?"포기함":"회복 중")):"";
  var missTxt=P.missed[i]>=1?(FF.fInt(P.missed[i])+"t을 다른 판로에 양보"):"";
  return FV._h("div",{class:"chan-card"},[
   FV._h("div",{class:"chan-id"},[
    FV._h("span",{class:"chan-name"},FV.say("channel",r.key))
   ]),
   kv("관계",FV.say("relword",String(r.rel)),"chan-rel"),
   FV._h("div",{class:"chan-alloc"},[
    FV._h("span",{class:"chan-kv-label"},"배정")," ",
    FV._h("span",{class:"chan-kv-value"},FF.fInt(P.preview[i])+"t"),
    " / 주문 "+FF.fInt(P.est[i])+"t"+statusTxt
   ]),
   missTxt?FV._h("div",{class:"chan-kv-note"},missTxt):null,
   FV._h("div",{class:"chan-cond"},[
    kv("가격",r.price+"원"),
    kv("최대",r.cap+"t"),
    kv("보장",r.floor>0?(r.floor+"t"):"—")
   ]),
   FV._h("div",{class:"chan-policy"},STANCE_LEVELS.map(function(lv){
    return FV._h("button",{class:"pol"+(P.levels[i]===lv?" pol-on":""),
     onClick:function(){FF.setChannelStance(i,lv)}},FV.say("stance",String(lv)));
   }))
  ]);
 });
 // 판매 가능(공급 쪽 상한)과 예상 판매(배정의 합, Σ 판로 배정)를 나란히 둔다.
 // 플레이어가 판로 세 줄을 직접 더하지 않아도 오늘 몇 t을 팔 계획인지 바로 보이게 하기 위해서다.
 // 둘이 다르면(미배정>0) 수요가 판매 가능보다 적어서 판매 가능을 다 못 채운다는 뜻이다.
 var sellable=P.inv+P.exp, capSales=FF.capsOf().sales, old=FF.oldStock();
 var unassigned=P.pool-P.sum;
 return FV._h("div",{id:"kchan",class:"chan"},[
  FV._h("div",{class:"chan-head"},[
   FV._h("div",{class:"chan-head-col"},[
    FV._h("div",{class:"chan-head-main"},[
     FV._h("span",{class:"chan-head-label"},"판매 가능"),
     FV._h("span",{class:"chan-head-value"},FF.fInt(P.pool)+"t")
    ]),
    FV._h("div",{class:"chan-head-note"},
     "재고 "+FF.fInt(P.inv)+"t · 오늘 입고 예상 "+FF.fInt(P.exp)+"t"+
     (sellable>capSales?(" · 판매 한도 "+capSales+"t"):""))
   ]),
   FV._h("div",{class:"chan-head-col"},[
    FV._h("div",{class:"chan-head-main"},[
     FV._h("span",{class:"chan-head-label"},"예상 판매"),
     FV._h("span",{class:"chan-head-value"},FF.fInt(P.sum)+"t")
    ]),
    unassigned>=1?FV._h("div",{class:"chan-head-note"},"미배정 "+FF.fInt(unassigned)+"t"):null
   ]),
   old>=1?FV._h("div",{class:"chan-head-old"},"오래된 재고 "+FF.fInt(old)+"t"):null
  ]),
  rows,
  FV._h("div",{class:"chan-sum"},[
   FV._h("span",{},"보장 판로부터 확보한 뒤 나머지를 태도 비중으로 나눈다"),
   FV._h("button",{class:"cs cs-auto",onClick:function(){FF.clearStance()}},"초기화")
  ])
 ]);
}

// 판매 한도 증설. 최근에 한도가 실제 병목이었거나 지금 배정에서 놓치는 물량이 있을 때만 보인다.
FV.CapacityButton=function(){
 FF.observe();
 if(FF.isOver()||!FF.started())return null;
 var on=FF.queued("sales");
 if(!on){
  var hit=FF.capHits("sales",5);
  var shortfall=FF.stancePlan().missed.some(function(m){return m>=1});
  if(!hit.n&&!hit.last&&!shortfall)return null;
 }
 var opt=FF.optionOf("sales");
 return FV._h("button",{id:"kbs",class:"btn-cell"+(on?" opt-on":""),
   style:{borderColor:on?"var(--border-accent)":"var(--border-strong)",
     background:"transparent",opacity:(opt.affordable||on)?"1":"0.4"},
   onClick:function(){if(!FF.isOver())FF.toggleBuy("sales")}},[
  FV._h("div",{},"판매 한도 늘리기"),
  FV._h("div",{class:"opt-price"},FV.capShift("sales")+" · "+mo(opt.cost)+"원")
 ]);
}

FV.NavBarView=function(){
 FF.observe(); FF.SIG.newGame.value;
 var mid=!FF.isOver()&&FF.started(), done=FF.isOver(), arm=FF.SIG.newGame.value;
 var S=FF.status();
 var d=S?S.day:1, pf=S?S.profit:null;
 var label=function(){
  if(FF.isOver())return "운영 종료";
  if(!FF.started())return null;
  var sig=FF.signalOf();
  if(sig.length){
   var s0=sig[0];
   var name=FV.say("channel",FF.C.channels[s0.i].key);
   return "최근 사건: "+name+" 관계가 "+(s0.type==="recover"?"회복되었습니다":"악화되었습니다");
  }
  var ev=FF.evt();
  return ev?FV.EVENT_TEXT[ev.b]:"특이사항 없이 운영 중";
 }();
 var newGame=function(){
  var m=!FF.isOver()&&FF.started();
  if(m&&!FF.SIG.newGame.value){
   FF.SIG.newGame.value=true;
   setTimeout(function(){FF.SIG.newGame.value=false},FF.C.ui.newArmMs);
   return;
  }

 };
 return FV._html`
  <${FV._F}>
   <div style=${{display:"flex",alignItems:"center",gap:"6px",margin:"20px 0 12px"}}>

    <div style=${{fontSize:"13px",color:"var(--text-secondary)"}}>어제 손익 <span id="kp" style=${{fontWeight:"500",color:pf===null?"var(--text-primary)":(pf>=0?"var(--text-success)":"var(--text-danger)")}}>${pf===null?"—":((pf>=0?"+":"-")+mo(Math.abs(pf)))}</span></div>

}
// 실시간 시계. 표현 시간과 시뮬레이션 시간을 분리한다.
// 재생을 누를 때만 타이머가 생긴다. 누르지 않으면 타이머가 없다.
FV.CLOCK_MS=5000;
// 시계 수명. 시작과 정지를 명시적으로 관리한다.
// 다음 하루까지 남은 초.
FV.clockLeft=function(){
 return Math.max(0,Math.round((FV.CLOCK_MS-(FV._acc||0))/1000));
}

FV.newGame=function(seed){
 FV.stopClock();
 FF.startNew(seed);
}

FV.TICK_MS=1000;
FV.startClock=function(){
 if(FV._timer)return;
 FV._timer=setInterval(function(){
  if(!FF.clockOf().running||FF.isOver()){FV.stopClock();return}
  FV._acc=(FV._acc||0)+FV.TICK_MS;
  if(FV._acc>=FV.CLOCK_MS){FV._acc=0;FF.tickDay()}
  else FF.repaint();
 },FV.TICK_MS);
}

// 시계를 멈춘다. 테스트와 창 종료에서 부른다.
FV.stopClock=function(){
 if(!FV._timer)return;
 clearInterval(FV._timer);
 FV._timer=null; FV._acc=0;
}

FV.paint=function(){
 if(FV.MOUNT)return;
 FV.MOUNT=document.getElementById("app");
 FV._render(FV._html`<${FV.App} />`,FV.MOUNT);
}


})(window.FF,window.FV);
</script>
<script id="src-boot">
(function(FF,FV){
var h=(location.hash||"").match(/seed=(\d+)/);
FF.reset(h?parseInt(h[1],10):Math.floor(Math.random()*99999)+1);
FV.paint();
})(window.FF,window.FV);
</script>
