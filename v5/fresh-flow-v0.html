<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>양파 · 30일 운영</title>
<style>
:root{
 --surface-0:#f4f1e9;--surface-1:#e9e4d7;--surface-2:#fbf9f4;
 --text-primary:#211d16;--text-secondary:#5a5346;--text-muted:#8d8574;
 --text-success:#2f6b4f;--text-danger:#9c3312;--text-warning:#8a5a08;
 --bg-warning:#f2e3c4;--bg-danger:#f6ded4;--border:rgba(33,29,22,.16);--border-strong:rgba(33,29,22,.34);
 --border-warning:#b4780c;--border-accent:#9c3312;--radius:2px;
 font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI","Malgun Gothic",ui-sans-serif,system-ui,sans-serif;
 --font-num:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
 :root{
  --surface-0:#131210;--surface-1:#1e1c17;--surface-2:#262219;
  --text-primary:#f5f1e8;--text-secondary:#c4bba6;--text-muted:#9c9382;
  --text-success:#8fd4a8;--text-danger:#f0a077;--text-warning:#f0c674;
  --bg-warning:#4a3410;--bg-danger:#3d1f12;--border:rgba(245,241,232,.22);--border-strong:rgba(245,241,232,.42);
  --border-warning:#f0c674;--border-accent:#f0a077;
 }
}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-0);color:var(--text-primary)}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 0}
button{background:transparent;color:var(--text-primary);border:1px solid var(--border-strong);
 border-radius:var(--radius);cursor:pointer;font-family:inherit;letter-spacing:-.01em;
 transition:background .12s ease,border-color .12s ease}
button:hover{background:var(--surface-1);border-color:var(--text-secondary)}
button:active{background:var(--surface-2)}
body{font-variant-numeric:tabular-nums}
#kd,#kc,#kp,#ks{font-family:var(--font-num)}

.card{background:var(--surface-1);border-radius:var(--radius);padding:14px;margin-bottom:1rem}
.card-sm{background:var(--surface-1);border-radius:var(--radius);padding:10px 12px;margin-bottom:1rem}
.card-note{background:var(--surface-1);border-radius:var(--radius);padding:9px 11px;margin-bottom:10px;font-size:12px;color:var(--text-secondary)}
.outlook-block{margin:10px 0 4px}
.fd-subhead{font-size:12px;color:var(--text-secondary);margin-top:10px;margin-bottom:2px}
.btn-full{width:100%;padding:11px 8px;font-size:13px;line-height:1.4;margin-bottom:8px}
.btn-sub{width:100%;padding:10px 8px;font-size:13px;margin-bottom:6px}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-cell{padding:10px 4px;font-size:12px;line-height:1.4}
.btn-plain{width:100%;padding:8px;font-size:12px;margin-bottom:8px;border:0;background:transparent;color:var(--text-muted)}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:8px}
.note{font-size:11px;color:var(--text-muted);margin-bottom:6px}
.note-b{font-size:11px;color:var(--text-muted);margin-bottom:1rem}
.lbl{font-size:12px;color:var(--text-muted);margin:0 0 6px}
.sub{font-size:12px;color:var(--text-secondary);margin-bottom:8px}
.sub-b{font-size:12px;color:var(--text-secondary);margin-bottom:1rem}
.sub-p{font-size:13px;color:var(--text-secondary);margin-bottom:8px}
.gap-s{margin-bottom:8px}
.gap-m{margin-bottom:12px}
.frame{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:10px}
/* 캐러셀: CSS scroll-snap 만 쓴다. 탭은 앵커 링크다. */
.pager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;
 scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.pager::-webkit-scrollbar{display:none}
/* 한 면은 컨테이너 폭 그대로. 넘치는 내용은 면 안에서 처리한다. */
.pane{flex:0 0 100%;min-width:0;max-width:100%;scroll-snap-align:start;
 box-sizing:border-box;overflow-x:hidden}
.pane>*{max-width:100%}
/* 결과 보고서 */
.section-title{font-size:11px;color:var(--text-muted);letter-spacing:.04em;margin:14px 0 4px}
.stat-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:5px 0}
.stat-label{font-size:12px;color:var(--text-secondary);min-width:76px}
.stat-value{font-size:14px;color:var(--text-primary);flex:1}
.stat-note{font-size:11px;color:var(--text-muted);text-align:right}
.fold{border-top:0.5px solid var(--border);margin-top:10px;padding-top:8px}
.fold-head{cursor:pointer;font-size:12px;color:var(--text-secondary);list-style:none;
 padding:2px 0}
.fold-head::-webkit-details-marker{display:none}
.fold-head::before{content:"\25b8 ";color:var(--text-muted)}
.fold[open]>.fold-head::before{content:"\25be "}
.fold-body{margin-top:6px}
.trendstrip{margin:2px 0 6px}
.spark{display:flex;align-items:baseline;gap:8px;font-size:12px;padding:1px 0}
.spark-name{color:var(--text-muted);min-width:62px}
.spark-new{display:inline-block;animation:spark-in 260ms ease-out}
@keyframes spark-in{from{opacity:0;transform:translateX(4px)}to{opacity:1;transform:none}}
.spark-bars{font-family:monospace;letter-spacing:1px;color:var(--text-secondary)}
.spark-now{margin-left:auto;color:var(--text-primary)}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.opt-size{font-size:13px;color:var(--text-primary)}
.opt-price{font-size:11px;color:var(--text-primary);padding:2px 0 4px}
.opt-note{font-size:10px;color:var(--text-muted);line-height:1.4}
.opt-on{border-color:var(--border-accent)}
.chan{margin:4px 0 2px}
.chan-card{padding:8px 0;border-top:1px solid var(--border)}
.chan-card:first-of-type{border-top:0}
.chan-id{display:flex;align-items:baseline;gap:6px;font-size:14px}
.chan-name{color:var(--text-primary)}
.chan-rel{margin-top:2px}
.chan-alloc{margin-top:6px;font-size:13px;color:var(--text-secondary)}
.chan-alloc .chan-kv-label{display:inline-block;width:32px}
.chan-cond{display:grid;grid-template-columns:1fr 1fr 1fr;column-gap:8px;margin-top:6px}
.chan-kv{display:grid;grid-template-columns:32px 1fr;font-size:12px;color:var(--text-secondary);padding:1px 0}
.chan-kv-label{color:var(--text-muted)}
.chan-kv-value{color:var(--text-primary)}
.chan-kv-note{font-size:11px;color:var(--text-muted);padding-left:32px;margin-top:1px}
.chan-policy{display:flex;gap:5px;margin-top:6px}
.pol{flex:1;padding:6px 0;font-size:12px;font-family:inherit;background:none;
 border:1px solid var(--border-strong);border-radius:var(--radius);
 color:var(--text-secondary);cursor:pointer}
.pol-on{border-color:var(--border-accent);color:var(--text-primary);background:var(--surface-1)}
.clockbar{display:flex;align-items:center;gap:6px;margin:10px 0 4px}
.clk{padding:4px 10px;font-size:12px;font-family:inherit;background:none;
 border:0.5px solid var(--border-strong);border-radius:var(--radius);
 color:var(--text-secondary);cursor:pointer}
.clk-on{border-color:var(--border-accent);color:var(--text-primary)}
.clk-day{margin-left:auto;font-size:12px;color:var(--text-muted)}
.outlook-head{font-size:12px;color:var(--text-secondary);margin:8px 0 4px}
.ospans{display:flex;gap:6px}
.ospan{flex:1;min-width:0}
.ospan-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.ospan-name{font-size:11px;color:var(--text-primary)}
.ospan-days{font-size:10px;color:var(--text-muted)}
.ospan-bars{display:flex;align-items:flex-end;gap:3px;height:52px;margin:2px 0 0}
.ob{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px}
.ob-pct{font-size:10px;color:var(--text-secondary)}
.ob-bar{width:100%;border-radius:2px 2px 0 0}
.ob-low{background:var(--text-warning);opacity:.75}
.ob-mid{background:var(--border-strong)}
.ob-high{background:var(--text-success);opacity:.8}
.ob-name{font-size:9px;color:var(--text-muted)}
.ospan-verdict{font-size:11px;color:var(--text-primary);line-height:1.35;margin:3px 0 1px}
.tabs{display:flex;gap:14px;font-size:12px;margin:0 0 8px}
.tabs a{color:var(--text-muted);text-decoration:none;padding-bottom:2px}
.tabs a:active{color:var(--text-primary)}
/* 지원 브라우저에서는 위치 표시 점을 붙인다. */
@supports selector(::scroll-marker){

.outlook-head{font-size:12px;color:var(--text-secondary);margin:6px 0 2px}
.outlook-row{display:grid;grid-template-columns:56px repeat(3,1fr);gap:4px;padding:3px 0}
.outlook-label{font-size:12px;color:var(--text-secondary);display:flex;flex-direction:column}
.outlook-sub{font-size:10px;color:var(--text-muted)}

.tabs{display:none}

 .pane::scroll-marker{content:"";width:7px;height:7px;border-radius:50%;
  background:var(--border-strong);cursor:pointer}
 .pane::scroll-marker:target-current{background:var(--text-primary)}
}
.dock-space{height:12px}
.dock{max-height:72vh;overflow-y:auto;position:sticky;bottom:0;z-index:5;background:var(--surface-0);
 border-top:1px solid var(--border);
 padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));
 margin:0 -20px;padding-left:20px;padding-right:20px}
.dock .btn-full,.dock .btn-sub{margin-bottom:6px}
.dock > :last-child{margin-bottom:0}
.chan-head{display:grid;grid-template-columns:1fr 1fr;column-gap:12px;margin-bottom:5px}
.chan-head-main{display:flex;justify-content:space-between;align-items:baseline}
.chan-head-label{font-size:13px;color:var(--text-secondary)}
.chan-head-value{font-size:20px;font-weight:600;color:var(--text-primary)}
.chan-head-note{font-size:11px;color:var(--text-muted);margin-top:1px}
.chan-head-old{grid-column:1/-1;font-size:11px;color:var(--text-warning);margin-top:2px}
.cs{width:40px;height:40px;padding:0;font-size:20px;line-height:1;font-family:inherit;background:none;
 border:1px solid var(--border-strong);border-radius:var(--radius);
 color:var(--text-secondary);cursor:pointer;flex:0 0 auto}
.cs:disabled{opacity:.3;cursor:default}
.cs-auto{width:auto;height:32px;padding:0 10px;font-size:11px;margin-left:auto}
.chan-sum{display:flex;align-items:center;gap:8px;font-size:11px;
 color:var(--text-secondary);margin-top:5px;padding-top:5px;
 border-top:1px solid var(--border)}
.chan-rest{color:var(--text-warning)}
.issuebar{margin:4px 0 10px;display:flex;flex-direction:column;gap:8px}
.sig{font-size:12px;padding:6px 9px;border-radius:var(--radius);border:1px solid var(--border)}
.sig-decline{color:var(--text-warning);border-color:var(--border-warning);background:var(--bg-warning)}
.sig-stuck{color:var(--text-warning);border-color:var(--border-warning);background:var(--bg-warning)}
.sig-recover{color:var(--text-success);border-color:var(--text-success)}
.issue{padding:8px 9px;border-radius:var(--radius);border:1px solid var(--border-strong)}
.issue-head{font-size:12px;color:var(--text-primary)}
.issue-nums{font-size:11px;color:var(--text-secondary);margin-top:2px}
.issue-verdict{font-size:11px;color:var(--text-warning);margin-top:2px}
.issue-accepted{opacity:.6}
.issue-accepted .issue-verdict{color:var(--text-muted)}
.issue-btn{margin-top:5px;padding:4px 10px;font-size:11px}
.issue-ack{display:block;margin-top:5px;font-size:11px;color:var(--text-muted)}
.dayresult{margin:2px 0 8px}
.dr-row{font-size:12px;color:var(--text-secondary);padding:2px 0}
.rellog{display:flex;flex-direction:column;gap:4px}
.rl-row{font-size:12px;color:var(--text-secondary);padding:3px 0;border-bottom:1px solid var(--border)}
.rl-day{color:var(--text-muted);font-size:11px;margin-right:4px}

 return {
  tilt:function(){return {supply:ts,demand:td}},
  phase:function(){return {supply:si,demand:di}},
  next:function(){
   var dem=Math.max(0,rng.norm(R.dm[di],R.dd));
   // 판로별 수요. 전체 수요를 상한 비율로 나누고 판로마다 다른 변동을 준다.
   var totCap=0, ci;
   for(ci=0;ci<R.channels.length;ci++)totCap+=R.channels[ci].cap;
   var chDem=[];
   for(ci=0;ci<R.channels.length;ci++){
    var c=R.channels[ci];
    var vol=(c.key==="whole")?0.2:0.4;
    chDem.push(Math.max(0,dem*(c.cap/totCap)*(1-vol+rng.next()*vol*2)));
   }
   var input={production:Math.max(0,rng.norm(R.sm[si],R.sd)),
              demand:dem, chDemand:chDem,
              supplyPhase:si, demandPhase:di};
   si=FF.mvSeq(rng,si,R,ts); di=FF.mvSeq(rng,di,R,td);
   input.nextSupplyPhase=si; input.nextDemandPhase=di;

}



FF.stepState=function(s,prod,dem,rules){
 var R=rules||FF.C;
 // 오늘 회수되는 매출채권을 먼저 현금으로 바꾼다.
 // 오늘 갚아야 할 매입채무를 먼저 낸다.
 if(s.ap&&s.ap.length){
  var keepA=[];
  for(var pi=0;pi<s.ap.length;pi++){
   if(s.ap[pi].at<=s.day)s.cash-=s.ap[pi].amt; else keepA.push(s.ap[pi]);
  }
  s.ap=keepA;
 }
 if(s.ar&&s.ar.length){
  var keep=[];
  for(var ai=0;ai<s.ar.length;ai++){
   if(s.ar[ai].at<=s.day)s.cash+=s.ar[ai].amt; else keep.push(s.ar[ai]);
  }
  s.ar=keep;
 }
 var tot=function(){var t=0;for(var i=0;i<s.lots.length;i++)t+=s.lots[i].q;return t};
 var on=Math.min(s.cap.sales,FF.expD(s.di,1,3,R)), om=Math.min(s.cap.sales,FF.expD(s.di,4,7,R));
 var cv=(s.cover===undefined)?R.cover:s.cover;
 var need=Math.max(0,cv*on+R.alpha*Math.max(0,om-on)*R.mid-tot());
 var baseAcc=Math.min(prod,s.cap.intake,need);
 // 초과분 매입 계약: 한도를 넘은 물량 중 최대 X t 를 더 받는다.
 // 한도 자체는 늘리지 않고 목표재고와 창고 제약은 그대로다.
 var over=Math.max(0,prod-s.cap.intake);
 var extra=s.contract>0?Math.min(over,s.contract,Math.max(0,need-baseAcc)):0;
 var acc=baseAcc+extra;
 var reach=Math.min(prod,s.cap.intake)+extra;
 var refused=reach-acc, wI=prod-acc;
 var freeNow=Math.max(0,s.cap.storage-tot());
 var byCap=Math.max(0,over-extra);
 var rest=wI-byCap;
 var byStore=Math.min(rest,Math.max(0,reach-freeNow));
 var byNeed=Math.max(0,rest-byStore);
 var stored=Math.min(acc,freeNow), wS=acc-stored;
 // 매입은 지금 손에 있는 현금으로만 한다. 모자라면 그만큼 덜 받는다.
 var budget=Math.max(0,s.cash-R.fixed);
 var payable=(R.farm>0)?Math.min(stored,budget/R.farm):stored;
 var short=stored-payable;
 if(short>R.ui.zero){ stored=payable; wS+=short; }
 if(stored>0)s.lots.push({q:stored,a:0});
 var sellable=tot();
 // 판로 배분. s.alloc 은 판로별 비중, s.stance 는 판로별 태도(양보/보통/우선/보장)다. 없으면 비싼 곳부터 채운다.
 // s.cap.sales 는 판로 상한과 별개로 하루 전체 판매량의 총상한이다. sold 가 거기 닿으면 더 못 판다.
 var CHS=R.channels, nch=CHS.length;
 var relv=s.rel||[], sold=0, rev=0, ageMix=[], toCh=[], revCh=[];
 var chDem=[];
 for(var ci=0;ci<nch;ci++){chDem.push(0);toCh.push(0);revCh.push(0)}
 // 오늘 판로 수요는 world 가 준다. 없으면 전체 수요를 상한 비율로 나눈다.
 var src=s._chDemand||null;
 for(ci=0;ci<nch;ci++){
  var rl2=relv[ci]===undefined?R.rel.start:relv[ci];
  var cap2=CHS[ci].cap*R.rel.cap[rl2];
  var d0=src?src[ci]:(dem*CHS[ci].cap/ (function(){var t=0;for(var z=0;z<nch;z++)t+=CHS[z].cap;return t})());
  var fl=CHS[ci].quota*R.rel.floor[rl2];
  chDem[ci]=Math.min(cap2,Math.max(d0,(CHS[ci].key==="fran")?fl:0));
 }
 // 나이가 오래된 lot 부터 본다. 한 판로에 팔고 대금을 잡는 공통 처리다.
 s.lots.sort(function(a,b){return b.a-a.a});
 var sellUnit=function(c2,age){
  var rl3=relv[c2]===undefined?R.rel.start:relv[c2];
  return CHS[c2].price[age]*R.rel.price[rl3]*R.q[Math.min(age,R.ttl-1)];
 };
 var settleSale=function(c2,amt){
  rev+=amt; revCh[c2]+=amt;        // 손익은 발생 시점에 잡는다
  var lag=CHS[c2].settle;
  if(lag>0){ s.ar=s.ar||[]; s.ar.push({at:s.day+lag,amt:amt}); }
  else s.cash+=amt;                // 당일 정산은 즉시 현금
 };
 var hasStance=s.stance&&s.stance.length===nch;
 // 보장 예약 + 가중치 water-filling. 미리보기(stancePlan)와 같은 FF.allocatePool을 쓴다.
 // pool은 물리 재고와 하루 판매 총상한 중 작은 쪽이다. 그래야 목표가 처음부터 상한을 넘지 않는다.
 var target=hasStance?FF.allocatePool(Math.min(sellable,Math.max(0,s.cap.sales-sold)),chDem.slice(),
   s.stance,CHS.map(function(c){return c.quota}),R):null;
 // 명시 배분(s.alloc)이 있으면 그것으로, 태도도 배분도 없으면 null(단가 순)로 정렬 순서를 정한다.
 var effAlloc=(s.alloc&&s.alloc.length===nch)?s.alloc
   :(hasStance?s.stance.map(function(lv){return R.stance.weight[lv]}):null);
 var order=[];
 for(ci=0;ci<nch;ci++)order.push(ci);
 for(var li=0;li<s.lots.length;li++){
  var lot=s.lots[li];
  if(lot.q<=R.ui.zero)continue;
  var age=Math.min(lot.a,R.ttl-1);
  // 이 lot 를 어느 판로에 넣을지: 목표가 있으면 남은 목표가 큰 순, 비중만 있으면 그 순서, 없으면 단가 순
  var seq=order.slice();
  if(target){
   seq.sort(function(a,b){return (target[b]-toCh[b])-(target[a]-toCh[a])});
  } else if(effAlloc){
   seq.sort(function(a,b){return effAlloc[b]-effAlloc[a]});
  } else {
   seq.sort(function(a,b){
    var ra=relv[a]===undefined?R.rel.start:relv[a], rb=relv[b]===undefined?R.rel.start:relv[b];
    return CHS[b].price[age]*R.rel.price[rb]-CHS[a].price[age]*R.rel.price[ra];
   });
  }
  for(var si2=0;si2<seq.length&&lot.q>R.ui.zero;si2++){
   var c2=seq[si2];
   // 목표나 비중이 있으면 그 판로에 배정된 몫을 넘지 않는다.
   var quotaLeft=chDem[c2];
   if(target){
    quotaLeft=Math.min(quotaLeft,Math.max(0,target[c2]-toCh[c2]));
   } else if(effAlloc){
    var wsum=0; for(var wi=0;wi<nch;wi++)wsum+=effAlloc[wi];
    if(wsum>0){
     var share=sellable*effAlloc[c2]/wsum;
     quotaLeft=Math.min(quotaLeft,Math.max(0,share-toCh[c2]));
    }
   }
   var take=Math.min(lot.q,quotaLeft,Math.max(0,s.cap.sales-sold));
   if(take<=R.ui.zero)continue;
   lot.q-=take; chDem[c2]-=take; sold+=take; toCh[c2]+=take;
   ageMix.push({a:lot.a,q:take});
   var amt=take*sellUnit(c2,age);
   settleSale(c2,amt);
  }
 }
 // 관계 갱신. 쿼터를 채우면 오르고 절반도 못 넣으면 내린다.
 s.rel=s.rel||[];
 for(ci=0;ci<nch;ci++){
  var cur=s.rel[ci]===undefined?R.rel.start:s.rel[ci];
  if(toCh[ci]>=CHS[ci].quota-R.ui.zero){ if(s.day%R.rel.up===0)cur=Math.min(3,cur+1) }
  else if(toCh[ci]<CHS[ci].quota*0.5)cur=Math.max(0,cur-1);
  s.rel[ci]=cur;
 }
 var demTotal=0;
 for(ci=0;ci<nch;ci++)demTotal+=chDem[ci]+toCh[ci];
 var w=0, wT=0;
 for(i=0;i<s.lots.length;i++){
  var l=s.lots[i];
  if(l.q<=R.ui.zero)continue;
  l.a++;
  if(l.a>=R.ttl){wT+=l.q;continue}
  s.lots[w++]=l;
 }
 s.lots.length=w;
 var end=tot();
 var cost=end*R.hold+s.cap.intake*R.maint.intake+s.cap.storage*R.maint.storage+s.cap.sales*R.maint.sales
  +(wI+wS+wT)*R.waste+R.fixed+stored*R.farm;
 var profit=rev-cost;
 // 매출은 판로별 정산으로 이미 처리했다. 지출만 오늘 나간다.
 s.cash-=cost;
 return {prod:prod,dem:demTotal,acc:stored,refused:refused,sold:sold,missed:Math.max(0,demTotal-sold),
  ageMix:ageMix,wI:wI,wIcap:byCap,wIstore:byStore,wIneed:byNeed,wS:wS,wT:wT,
  end:end,profit:profit,sellable:sellable,toCh:toCh,revCh:revCh};
}



// 병목 판정. 그날의 사실이므로 커널의 일부다.
FF.bottleneck=function(s,r,dem,rules){
 var eps=(rules||FF.C).ui.eps, lossOut=Math.max(0,dem-r.sold);
 var cand=[
  ["ship",  (r.sold>=s.cap.sales-eps&&dem>r.sold+eps)?lossOut:0],
  ["stock", (r.sold<dem-eps&&r.sellable<=r.sold+eps)?lossOut:0],
  ["demand",(r.sold<s.cap.sales-eps&&r.sellable>r.sold+eps)?Math.max(0,s.cap.sales-dem):0],
  ["intake",r.wIcap],
  ["store", r.wIstore+r.wS+r.wT],
  ["supply",(r.wIneed<=eps&&r.wIcap<=eps&&r.wIstore<=eps&&r.prod<s.cap.intake-eps)?(s.cap.intake-r.prod):0],
  ["policy",r.wIneed]
 ];
 var b="none",bv=eps;
 for(var i=0;i<cand.length;i++)if(cand[i][1]>bv){bv=cand[i][1];b=cand[i][0]}
 return b;
}



// 하루 상태 전이. 게임 규칙은 이 함수에만 있다.
// 신호도 로그도 화면도 모른다. 상태와 사실만 다룬다.
//   state   {day,si,di,cash,lots,cap:{intake,storage,sales},pend,spent,buys}
//   command FF.Cmd 의 결과
//   world   FF.World 의 next() 출력
// 반환 {state, result, events}. state 는 제자리에서 전진한다.

FF.transition=function(state,command,world,rules){
 var R=rules||FF.C;
 var s=state, ev=[];
 if(s.pend){s.cap[s.pend]+=R.step[s.pend];ev.push({type:"capacity-applied",capacity:s.pend});s.pend=null}
 var C=command;
 var bought=null, cost=0;
 if(C.type==="sell"&&C.alloc&&C.alloc.length===R.channels.length){
  s.alloc=C.alloc.slice();
 }
 // 판로 태도: 판로마다 0~3 단계다. 보장 단계는 확보를, 나머지는 남는 물량의 비중을 정한다.
 if(C.type==="sell"&&C.stance&&C.stance.length===R.channels.length){
  s.stance=C.stance.slice();
 }
 if(C.type==="policy"){
  var ok=false;
  for(var pi=0;pi<R.policy.length;pi++)if(R.policy[pi].v===C.cover)ok=true;
  if(ok&&s.cover!==C.cover){
   s.cover=C.cover;
   ev.push({type:"policy",cover:C.cover,day:s.day});
  }
 }
 if(C.type==="contract"){
  var opt=FF.contractOption(C.size,R);
  if(opt&&opt.x>0
     &&(s.buys?s.buys.contract:0)<R.contract.max
     &&s.day<=(R.contract.until||R.days)
     &&s.cash>=opt.price){
   cost=opt.price;
   s.cash-=cost; s.spent+=cost; s.contract=opt.x;
   if(s.buys)s.buys.contract++;
   bought="contract";
   ev.push({type:"purchase",capacity:"contract",cost:cost,day:s.day});
  }
 }
 if(C.type==="buy"&&R.cost[C.capacity]!==undefined&&s.cash>=R.cost[C.capacity]){
  bought=C.capacity; cost=R.cost[bought];
  s.cash-=cost; s.spent+=cost; s.pend=bought;
  if(s.buys)s.buys[bought]++;
  ev.push({type:"purchase",capacity:bought,cost:cost,day:s.day});
 }
 s.si=world.supplyPhase; s.di=world.demandPhase;
 var r=FF.stepState(s,world.production,world.demand,R);
 r.bought=bought; r.cost=cost;
 r.b=FF.bottleneck(s,r,world.demand,R);
 if(r.wIcap>R.ui.eps)ev.push({type:"capacity-hit",capacity:"intake",amount:r.wIcap});
 if(r.wIstore+r.wS>R.ui.eps)ev.push({type:"capacity-hit",capacity:"storage",amount:r.wIstore+r.wS});
 if(r.missed>R.ui.eps)ev.push({type:"demand-missed",amount:r.missed});
 ev.push({type:"day-ended",day:s.day,profit:r.profit-cost});
 // 최근 사흘의 관측을 남긴다. 화면의 못 판 주문과 같은 값이다.
 if(s.recent){
  s.recent=s.recent.concat([{missed:r.missed,dem:r.dem}]).slice(-3);
 }
 s.day++; s.si=world.nextSupplyPhase; s.di=world.nextDemandPhase;
 if(s.cash<=0)ev.push({type:"bankrupt",day:s.day-1});
 return {state:s,result:r,events:ev};
}

// 관측 기록. 게임 규칙이 아니라 기록 담당이다.
// 커널이 낸 결과와 사건을 소비해 로그를 쌓는다.
FF.initialState=function(world,rules){
 var R=rules||FF.C;
 return {day:1,si:world.phase().supply,di:world.phase().demand,
  cash:R.cash,lots:[],
  cap:{intake:R.cap.intake,storage:R.cap.storage,sales:R.cap.sales},
  pend:null,spent:0,contract:0,cover:R.cover,ar:[],
  rel:R.channels.map(function(){return R.rel.start}),alloc:null,stance:null,
  buys:{sales:0,contract:0},
  recent:[]};
}

// 전략이 상태를 읽을 때 쓰는 조회. 커널 상태의 파생값이다.
FF.step=function(state,command,world,rules){
 var next=FF.forkState(state);
 var out=FF.transition(next,command,world,rules);
 return {state:next,result:out.result,events:out.events};
}

// 분기. 상태를 복사해 갈라진다. 바뀌는 것만 새로 만든다.
FF.forkState=function(s){
 return {day:s.day,si:s.si,di:s.di,cash:s.cash,
  lots:s.lots.map(function(l){return {q:l.q,a:l.a}}),
  cap:{intake:s.cap.intake,storage:s.cap.storage,sales:s.cap.sales},
  pend:s.pend,spent:s.spent,contract:s.contract||0,cover:s.cover,
  ar:(s.ar||[]).map(function(x){return {at:x.at,amt:x.amt}}),
  rel:(s.rel||[]).slice(),alloc:s.alloc?s.alloc.slice():null,
  stance:s.stance?s.stance.slice():null,dead:false,
  recent:s.recent?s.recent.slice():[],
  buys:s.buys?{sales:s.buys.sales,contract:s.buys.contract||0}:undefined};
}

// 최종 가치. 살아남았고 끝까지 갔으면 처분가치를 더한다.
// 순자산. 현금에 미회수 매출채권을 더한다.
FF.netWorth=function(s){
 var t=s.cash;
 if(s.ar)for(var i=0;i<s.ar.length;i++)t+=s.ar[i].amt;
 if(s.ap)for(var j=0;j<s.ap.length;j++)t-=s.ap[j].amt;
 return t;
}
FF.finalValue=function(s,fin,rules){
 var R=rules||FF.C;
 var nw=FF.netWorth(s);
 return (s.cash<=0||!fin)?nw:(nw+Math.round(s.spent*R.salvage));
}


FF.view={
 stock:function(s){var t=0;for(var i=0;i<s.lots.length;i++)t+=s.lots[i].q;return t},
 room:function(s){return Math.max(0,s.cap.storage-FF.view.stock(s))},
 canAfford:function(s,k){return s.cash>=FF.C.cost[k]},
 pending:function(s){return s.pend},
 // 최근 사흘 못 판 주문 비율. 플레이어가 화면에서 읽는 값이다.
 missRate:function(s){
  var H=s.recent||[], m=0, d=0;
  for(var i=0;i<H.length;i++){m+=H[i].missed;d+=H[i].dem}
  return d>0?m/d:0;
 }
};


// 데이터 전략. 규칙 목록을 자료구조로 표현하고 해석기가 명령으로 바꾼다.
// 규칙은 위에서 아래로 검사하고 처음 맞는 것을 쓴다.
//   {when:[{read:"stock", op:">", value:15}], then:{buy:"sales"}}
//   {then:{wait:true}}
FF.READ={
 stock:function(s){return FF.view.stock(s)},
 room:function(s){return FF.view.room(s)},
 cash:function(s){return s.cash},
 day:function(s){return s.day},
 capIntake:function(s){return s.cap.intake},
 capSales:function(s){return s.cap.sales},
 buysContract:function(s){return s.buys?(s.buys.contract||0):0},
 buysSales:function(s){return s.buys?s.buys.sales:0},
 pending:function(s){return s.pend?1:0}
};
FF.OP={
 ">":function(a,b){return a>b},
 "<":function(a,b){return a<b},
 ">=":function(a,b){return a>=b},
 "<=":function(a,b){return a<=b},
 "==":function(a,b){return a===b}
};
FF.evalCond=function(c,s){
 var read=FF.READ[c.read], op=FF.OP[c.op];
 if(!read||!op)return false;
 return op(read(s),c.value);
};
FF.compileStrategy=function(rules){
 return function(s){
  for(var i=0;i<rules.length;i++){
   var r=rules[i], ok=true;
   var when=r.when||[];
   for(var j=0;j<when.length&&ok;j++)ok=FF.evalCond(when[j],s);
   if(!ok)continue;
   if(r.then&&r.then.buy){
    if(!FF.view.canAfford(s,r.then.buy)||s.pend)return FF.Cmd.wait();
    return FF.Cmd.buy(r.then.buy);
   }
   return FF.Cmd.wait();
  }
  return FF.Cmd.wait();
 };
}

// 계획을 전략으로 올린다. 표는 날짜만 보는 전략이다.
//   plan {일차: 설비}  또는  function(state) -> Command
FF.asStrategy=function(plan){
 if(typeof plan==="function")return plan;
 if(Array.isArray(plan))return FF.compileStrategy(plan);
 return function(s){
  return FF.planCmd(plan[s.day]);
 };
}

// 시나리오 러너. 날짜 전진 구현은 이 함수 하나뿐이다.
//   base     계획표 또는 전략 함수
//   forks    [{at, plan}] at 일차의 기준선 상태에서 갈라진다
//   untilDay 지정하면 그날까지만
// 반환 {state, days:[{day,result,events}], forks:[최종상태]}
})(window.FF,window.FV);
</script>
<script id="src-runner">
(function(FF,FV){
// 참조 재생. 첫날 계약 x t 를 맺고 그 뒤 판매를 ns 회 산다.
FF.replay=function(seed,x,ns){
 var pl={},dd=2,kk;
 if(x>0)pl[1]="contract:"+x;
 for(kk=0;kk<ns;kk++){pl[dd]="sales";dd+=2}
 return FF.replayPlan(seed,pl);
}

// 참조 구현 전용. 실사용 경로는 분석 계층의 시뮬레이터 하나다.
// 최적화된 쪽이 틀리면 단위 테스트가 이것과 대조해 잡는다.
FF.replayPlan=function(seed,plan,untilDay){
 var r=FF.runScenario(seed,plan,untilDay);
 return FF.finalValue(r.state,!untilDay);
}


// 초기 상태. 커널이 다루는 값만 담는다.
FF.runTracks=function(seed,base,forks,untilDay,rules){
 var R=rules||FF.C;
 var W=FF.World(seed,R), main=FF.initialState(W,R), days=[], live=[], out=[];
 var LIM=untilDay||R.days;
 var baseDecide=FF.asStrategy(base);
 var forkDecide=function(plan){
  return function(s){
   if(s.day in plan)return FF.planCmd(plan[s.day]);
   return baseDecide(s);
  };
 };
 var advance=function(s,w){
  var r=FF.transition(s,s.decide(s),w,R);
  if(s.cash<=0)s.dead=true;
  return r;
 };
 main.decide=baseDecide; main.dead=false;
 for(var t=0;t<LIM;t++){
  var day=t+1, w=W.next(), i;
  for(i=0;i<forks.length;i++){
   if((forks[i].at||1)!==day)continue;
   var c=(day===1)?FF.initialState(W,R):FF.forkState(main);
   c.si=main.si; c.di=main.di;
   c.idx=i; c.decide=forkDecide(forks[i].plan); c.dead=false;
   live.push(c);
  }
  var keep=0;
  for(i=0;i<live.length;i++)if(!live[i].dead)live[keep++]=live[i];
  live.length=keep;
  for(i=0;i<live.length;i++)advance(live[i],w);
  if(!main.dead){
   var res=advance(main,w);
   days.push({day:day,result:res.result,events:res.events});
  }
  if(main.dead&&!live.length)break;
 }
 for(i=0;i<live.length;i++)out[live[i].idx]=live[i];
 return {state:main,days:days,forks:out};
}

// 한 갈래만 돌린다. 러너의 특수한 경우다.
FF.runScenario=function(seed,strategy,untilDay,rules){
 var r=FF.runTracks(seed,strategy,[],untilDay,rules);
 return {state:r.state,days:r.days};
}

// 순수 전이. 원본을 두고 새 상태를 돌려준다.
// 성능이 필요한 곳은 transition 을 직접 쓴다.
})(window.FF,window.FV);
</script>
<script id="src-record">
(function(FF,FV){
FF.capHits=function(kind,win){
 var lastBlocked=false;
 var since=FF.engineState().lastBuy[kind];
 var h=[];
 for(var i=0;i<FF.histOf().length;i++)if(FF.histOf()[i].day>since)h.push(FF.histOf()[i]);
 h=h.slice(-win);
 var n=0;
 for(var j=0;j<h.length;j++){
  if(kind==="intake"&&h[j].acc>=h[j].capI-0.05)n++;
  if(kind==="sales"&&h[j].sold>=h[j].capS-0.05&&h[j].dem>h[j].sold+0.05)n++;
 }
 if(h.length){
  var z=h[h.length-1];
  lastBlocked=kind==="intake"?(z.acc>=z.capI-0.05):(z.sold>=z.capS-0.05&&z.dem>z.sold+0.05);
 }
 return{n:n,len:h.length,last:lastBlocked};
}

FF.useRate=function(n){
 var h=FF.histOf().slice(-n);
 if(!h.length)return{intake:0,sales:0};
 var a=0,b=0;
 for(var i=0;i<h.length;i++){a+=h[i].acc/FF.plant().cap.intake;b+=h[i].sold/FF.plant().cap.sales}
 return{intake:a/h.length*100,sales:b/h.length*100};
}

FF.recordDay=function(r,ev){
 FF.pushHist({day:FF.run().day,prod:r.prod,dem:r.dem,acc:r.acc,refused:r.refused,sold:r.sold,
  missed:r.missed,ageMix:r.ageMix,wI:r.wI,wIcap:r.wIcap,wIstore:r.wIstore,wIneed:r.wIneed,
  wS:r.wS,wT:r.wT,end:r.end,profit:r.profit-r.cost,b:r.b,
  si:FF.MARKET.value.si,di:FF.MARKET.value.di,
  capI:FF.plant().cap.intake,capS:FF.plant().cap.sales,
  toCh:r.toCh.slice(),revCh:r.revCh.slice(),rel:FF.relOf().slice(),
  stance:(FF.stanceOf()||FF.C.channels.map(function(){return FF.C.stance.start})).slice()});
 for(var mi=0;mi<FF.logOf().mods.length;mi++){
  var md=FF.logOf().mods[mi];
  if(FF.run().day<=md.day)continue;
  md.use.push(md.kind==="contract"?(r.acc/FF.plant().cap.intake):(r.sold/FF.plant().cap.sales));
  md.extra=(md.extra||0)+(md.kind==="contract"?Math.max(0,r.acc-FF.plant().cap.intake):Math.max(0,r.sold-md.from));
  if(FF.run().day<=md.day+3){
   if(md.kind==="contract"&&r.acc>FF.plant().cap.intake+0.05)md.hit++;
   if(md.kind==="sales"&&r.sold>=FF.plant().cap.sales-0.05)md.hit++;
  }
 }
 var actionable=(r.b==="intake"||r.b==="ship"||r.b==="store"||r.b==="stock");
 var changed=(r.b!==FF.engineState().prevB);
 FF.engineState().prevB=r.b;
 FF.setEvent((actionable&&changed)?{b:r.b}:null);
 if(FF.evt())FF.append("evlog",{day:FF.run().day,b:r.b});
 if(ev)for(var q=0;q<ev.length;q++)if(ev[q].type==="purchase")
  FF.append("timeline",{day:ev[q].day,type:"buy",kind:ev[q].capacity,
   newCap:(ev[q].capacity==="contract")?FF.contractOf()
     :(FF.plant().cap[ev[q].capacity]+FF.C.step[ev[q].capacity])});
}

// 구매 순간의 관측치를 남긴다. 게임 규칙이 아니라 기록이다.
FF.recordPurchase=function(act,path,size){
 var day=FF.run().day;
 var T=FF.tiltOf();
 var svB=FF.pct(FF.blur(FF.hor(FF.MARKET.value.si,4,7,FF.C,T.supply)));
 var dvB=FF.pct(FF.blur(FF.hor(FF.MARKET.value.di,4,7,FF.C,T.demand)));
 if(act==="contract"){
  // 계약은 개장 전 결정이다. 근거는 관측이 아니라 월간 전망이다.
  size=size||FF.contractOf();
  FF.append("mods",{kind:act,day:day,idx:1,from:0,size:size,use:[],hit:0});
  FF.append("buylog",{day:day,kind:act,
   gap:dvB[2]-dvB[0], supplyGap:svB[2]-svB[0],
   tilt:T.demand, supplyTilt:T.supply,
   hitN:0,hitLen:0,left:FF.C.days-day,path:path||"manual",
   util:null,nth:1,cap:size});
  return;
 }
 FF.append("mods",{kind:act,day:day,idx:FF.plant().buys[act]+1,
   from:FF.plant().cap.sales,use:[],hit:0});
 var hB=FF.capHits(act,5),uB=FF.useRate(3);
 var gB=dvB[2]-dvB[0];
 var ES=FF.engineState();
 if(FF.dirOf(gB)!==0&&ES.phase[act].dir===FF.dirOf(gB))ES.phase[act].n++;
 else {ES.phase[act].dir=FF.dirOf(gB);ES.phase[act].n=FF.dirOf(gB)===0?0:1}
 ES.lastBuy[act]=day;
 FF.append("buylog",{day:day,kind:act,gap:gB,
  hitN:hB.n, hitLen:hB.len, left:FF.C.days-day, path:path||"manual",
  util:Math.round(uB.sales),
  nth:FF.plant().buys[act]+1,cap:FF.plant().cap.sales});
}

// 하루 시작 시점의 한도 도달 여부를 남긴다.
FF.recordDayStart=function(atCapIntake,atCapSales,act){
 FF.append("events",{day:FF.run().day,atCapIntake:atCapIntake,
   atCapShipping:atCapSales,bought:act||"none"});
}


// 새 사건을 진행 기록에 남긴다.
FF.recordEvent=function(){
 var ev=FF.evt();
 if(!ev)return;
 FF.append("timeline",{day:FF.run().day-1,type:"event",b:ev.b});
}

// 관계 신호와 이슈. 신호는 방금 무엇이 바뀌었는지, 이슈는 지금 무엇이 열려 있는지다.
// 이슈는 의도(우선/보장)와 실제(오늘 쿼터 미달)가 어긋날 때만 연다.
// 양보나 보통에서 쿼터를 못 채우는 것은 의도와 어긋나지 않으므로 이슈가 아니다.
// 오늘 막 떨어졌으면 decline, 이미 나쁜 상태였는데 이제 지키기로 했으면 stuck 이다.
// 이미 열려 있으면 다시 열지 않는다(매일 신호하지 않는다). 회복은 열린 이슈를 닫는다.
FF.recordIssues=function(prevRel,r){
 var CH=FF.C.channels, nch=CH.length, curRel=FF.relOf(), day=FF.run().day;
 var stance=FF.stanceOf();
 var issues=FF.issueOf().slice(), signals=[];
 for(var i=0;i<nch;i++){
  var lvl=(stance&&stance.length===nch)?stance[i]:FF.C.stance.start;
  var quotaFail=r.toCh[i]<CH[i].quota-FF.C.ui.zero;
  if(lvl>=2&&quotaFail){
   if(!issues[i]){
    issues[i]={since:day,resolution:null};
    signals.push({type:curRel[i]<prevRel[i]?"decline":"stuck",i:i,day:day,from:prevRel[i],to:curRel[i]});
   }
  } else if(curRel[i]>prevRel[i]&&issues[i]){
   signals.push({type:"recover",i:i,day:day,from:prevRel[i],to:curRel[i]});
   issues[i]=null;
  }
 }
 FF.setIssue(issues);
 FF.setSignal(signals);
 for(var si=0;si<signals.length;si++)FF.append("relLog",signals[si]);
}
})(window.FF,window.FV);
</script>
<script id="src-engine">
(function(FF,FV){
FF.reset=function(seed){FF.SIG.fin.value=false;FF.SIG.manual.value=false;FF.SIG.newGame.value=false;FF.EVENT.value=null;FF.PENDING.value=null;FF.PHASE.value="play";FF.resetRecover();FF.setContract(0);FF.setCover(FF.C.cover);FF.setRel(FF.C.channels.map(function(){return FF.C.rel.start}));FF.setAlloc(null);FF.setStance(null);FF.setIssue(null);FF.setSignal([]);FF.setAr([]);FF.setWorld(FF.World(seed));FF.setLots([]);FF.resetEngineState();FF.setMarket(FF.world().phase().supply,FF.world().phase().demand);FF.setTilt(FF.world().tilt());FF.resetLedger();FF.resetLog();FF.resetPlant();FF.resetRun(seed);
FF.setQueue([]);
 FF.setClock(false);
 FF.commit();FF.repaint()}


// 하루 물리. 물리는 이 함수에만 있다.
// s 를 제자리에서 전진시키고 그날의 관측치를 돌려준다.
// s = {si,di,cash,lots,cap:{intake,storage,sales}}  호출자가 필요하면 미리 복사해서 넘긴다.
FF.stepDay=function(cmd,path){
 if(FF.isOver())return;
 if(cmd.type==="finish"){FF.finishRun();return}
 var act=(cmd.type==="buy")?cmd.capacity:(cmd.type==="contract"?"contract":null);
 if(cmd.type==="policy")FF.setCover(cmd.cover);
 var pend=FF.PENDING.value;
 var prev=FF.histOf()[FF.histOf().length-1]||null;
 var atCapI=prev?prev.acc>=FF.plant().cap.intake-0.05:false;
 var atCapS=prev?prev.sold>=FF.plant().cap.sales-0.05:false;
 var price=(act==="contract")?(FF.contractOption(cmd.size)||{price:Infinity}).price:(act?FF.C.cost[act]:0);
 var willBuy=(act!==null&&FF.ledger().cash>=price
   &&(act!=="contract"||FF.contractOf()===0));
 if(willBuy)FF.recordPurchase(act,path,cmd.size);
 FF.recordDayStart(atCapI,atCapS,act);
 var s=FF.toKernelState();
 var send=willBuy?(act==="contract"?FF.Cmd.contract(cmd.size):FF.Cmd.buy(act))
   :((cmd.type==="sell"||cmd.type==="policy")?cmd:FF.Cmd.wait());
 var out=FF.transition(s,send,FF.world().next());
 var r=out.result;
 var prevRel=FF.relOf();
 FF.applyKernelState(s,r,pend);
 FF.recordDay(r,out.events);
 FF.recordIssues(prevRel,r);
 FF.advanceDay(s);
 if(FF.ledger().cash<=0){FF.setPhase("bust")}
 else if(FF.run().day>FF.C.days){
  if(!FF.isOver())FF.setSalvage(Math.round(FF.ledger().spent*FF.C.salvage));
  FF.setPhase("done");
 }
 FF.commit();
}





// 새 판. 시드를 주지 않으면 무작위로 고른다.
FF.startNew=function(seed){
 var v=parseInt(seed,10);
 FF.reset(v>0?v:Math.floor(Math.random()*99999)+1);
}

FF.finishRun=function(){
 if(FF.isOver())return;
 FF.markFinish();FF.commit();
 FF.append("timeline",{day:FF.run().day,type:"finish"});
 FF.setQueue([]);
 while(!FF.isOver())FF.stepDay(FF.Cmd.wait());
 FF.SIG.manual.value=false; FF.SIG.fin.value=false;
 FF.repaint();
}

// 실시간 진행. 하루 경계에서 대기 중인 결정 하나를 커밋하고 하루를 넘긴다.
// 하루 안 어느 시점에 눌렀는지는 결과에 영향을 주지 않는다.
FF.tickDay=function(){
 if(FF.isOver())return;
 var q=FF.queueOf().slice();
 var cmd=FF.Cmd.wait(), path=null;
 if(q.length){
  var head=q[0];
  cmd=(head.kind==="contract")?FF.Cmd.contract(head.size)
    :(head.kind==="policy")?FF.Cmd.policy(head.cover)
    :FF.Cmd.buy(head.kind);
  path=head.path||"manual";
  FF.setQueue(q.slice(1));
 }
 FF.stepDay(cmd,path);
 FF.rollRecover();
 FF.recordEvent();
 FF.SIG.manual.value=false;
 // 판이 끝나면 멈춘다. 병목이 바뀌는 것은 흔한 일이라 멈추지 않는다.
 if(FF.isOver())FF.setClock(false);
 FF.repaint();
}



})(window.FF,window.FV);
</script>
<script id="src-counter">
(function(FF,FV){


/* ---- Preact 렌더 브리지 ---- */

// 다중 재생: 계획 N개를 하루씩 동시에 전진시킨다.
// 접두를 공유하지 않는 계획들에 쓴다. 난수는 하루 한 번만 뽑는다.


// 시나리오 시뮬레이터. 반사실 계산의 유일한 경로다.
//   base      기준 계획 {일차: 설비}
//   variants  [{at, plan}]  at 일차의 기준선 상태에서 갈라져 plan 을 덮어쓴다.
//             at 이 1 이면 처음부터 자기 계획으로 간다.
//             plan 값이 null 이면 그날 사지 않는다.
//   untilDay  지정하면 그날까지만 돌리고 처분가치를 더하지 않는다.
// 난수는 계획과 무관하므로 하루에 한 번만 뽑아 모든 시나리오가 공유한다.
FF.simulate=function(seed,base,variants,untilDay){
 var r=FF.runTracks(seed,base,variants,untilDay);
 var fin=!untilDay;
 var value=function(s){return s?FF.finalValue(s,fin&&!s.dead):undefined};
 return {base:value(r.state),variants:r.forks.map(value)};
}

// 사후 기준 계획. 첫날 계약 크기와 판매 증설 횟수의 조합이다.
FF.planOf=function(x,ns){
 var pl={},dd=2,k;
 if(x>0)pl[1]="contract:"+x;
 for(k=0;k<ns;k++){pl[dd]="sales";dd+=2}
 return pl;
}

// 이번 판에서 실제로 한 것. 계약은 크기까지 남긴다.
// 이번 판에 맺은 계약 크기. 없으면 0 이다.
FF.myContractSize=function(){
 var m=FF.logOf().mods;
 for(var i=0;i<m.length;i++)if(m[i].kind==="contract")return m[i].size||0;
 return 0;
}

FF.currentPlan=function(){
 var p={},m=FF.logOf().mods;
 for(var i=0;i<m.length;i++){
  p[m[i].day]=(m[i].kind==="contract")?("contract:"+(m[i].size||0)):m[i].kind;
 }
 return p;
}

// 반사실 정의. 분석은 이 셋만 만들고 나머지는 시뮬레이터가 한다.
FF.Scenario={
 addOne:function(day,kind){var p={};p[day]=kind;return {at:day,plan:p}},
 removeOne:function(day){var p={};p[day]=null;return {at:day,plan:p}},
 fullPlan:function(plan){return {at:1,plan:plan}}
};

FF.compareStrategies=function(seeds,strategies){
 return strategies.map(function(st){
  var vals=seeds.map(function(sd){
   return FF.finalValue(FF.runScenario(sd,st.plan).state,true);
  });
  var sum=0,min=Infinity,max=-Infinity;
  vals.forEach(function(v){sum+=v;if(v<min)min=v;if(v>max)max=v});
  return {name:st.name,mean:Math.round(sum/vals.length),
    min:Math.round(min),max:Math.round(max),values:vals};
 });
}

// 월간 전망. 초순 중순 하순 각각의 국면 분포다.
// 오늘 국면에서 마르코프 전이를 돌려 구간 평균을 낸다.


// 사후 최선. 계약 크기 네 가지와 판매 증설 횟수의 조합을 전부 돌린다.
FF._hindsight=function(){
 var XS=FF.C.contract.options.map(function(o){return o.x});
 var plans=[],meta=[],i,s2;
 for(i=0;i<XS.length;i++)for(s2=0;s2<=5;s2++){
  plans.push(FF.planOf(XS[i],s2)); meta.push({i:XS[i],s:s2});
 }
 var mi=FF.myContractSize(), ms=FF.plant().buys.sales;
 plans.push(FF.planOf(mi,ms));
 var r=FF.simulate(FF.run().seed,{},plans.map(FF.Scenario.fullPlan)).variants;
 var base=0,best={i:0,s:0,v:-Infinity};
 for(i=0;i<meta.length;i++){
  if(meta[i].i===0&&meta[i].s===0)base=r[i];
  if(r[i]>best.v)best={i:meta[i].i,s:meta[i].s,v:r[i]};
 }
 return{base:base,best:best,mine:r[r.length-1]};
}


// 배치 재생: 시나리오 N개를 하루씩 동시에 전진시킨다.
// 난수는 계획과 무관하므로 하루에 한 번만 뽑아 전부가 공유한다.


// 분기 재생: 기준선을 한 번 전진하면서 각 날에서 갈라진다.
// 앞부분을 다시 돌지 않는다. 난수는 계획과 무관하므로 하루 한 번만 뽑는다.


// 지금까지의 계획. 분석의 기준선이다.
FF._missedOps=function(){
 var base=FF.currentPlan(), forks=[], vs=[], i;
 for(var day=2;day<=FF.C.days-2;day++){
  if(base[day])continue;
  ["sales"].forEach(function(k){
   forks.push({day:day,kind:k});
   vs.push(FF.Scenario.addOne(day,k));
  });
 }
 var r=FF.simulate(FF.run().seed,base,vs);
 var out=[];
 for(i=0;i<forks.length;i++)out.push({day:forks[i].day,kind:forks[i].kind,gain:Math.round(r.variants[i]-r.base)});
 out.sort(function(a,b){return b.gain-a.gain});
 return out;
}


FF._modContrib=function(){
 var mods=FF.logOf().mods;
 if(!mods.length)return null;
 var base=FF.currentPlan();
 var vs=mods.map(function(m){return FF.Scenario.removeOne(m.day)});
 var r=FF.simulate(FF.run().seed,base,vs);
 return r.variants.map(function(v){return Math.round(r.base-v)});
}

FF._recoverPct=function(kind){
 var mods=FF.logOf().mods, last=null;
 for(var i=0;i<mods.length;i++)if(mods[i].kind===kind)last=mods[i];
 if(!last||FF.isOver()||FF.run().day<=last.day+1)return null;
 var upto=FF.run().day-1;
 var r=FF.simulate(FF.run().seed,FF.currentPlan(),[FF.Scenario.removeOne(last.day)],upto);
 var gain=r.base-r.variants[0];
 var days=upto-last.day;
 var opt=(kind==="contract")?FF.contractOption(last.size||0):null;
 var cost=(kind==="contract")?(opt?opt.price:0)
  :(FF.C.cost[kind]+days*FF.C.step[kind]*FF.C.maint.sales);
 var val=Math.round(gain);
 var key=kind+":"+last.day, prev=FF.recoverPrev(key);
 FF.noteRecover(key,val);
 return{val:val,cost:cost,prev:prev};
}

FF.buyOffset=function(k){
 var o=FF.ord(k);
 if(o>0)return o-1;
 return FF.queueOf().length;
}

FF._breakEven=function(k){
 var off=FF.buyOffset(k);
 var days=Math.max(0,FF.C.days-FF.run().day-off);
 if(days<=0)return null;
 var step=FF.C.step[k];
 var maint=FF.C.maint.sales*step*days;
 var net=FF.C.cost[k]*(1-FF.C.salvage)+maint;
 var margin=FF.C.price;
 return{t:net/margin,cost:Math.round(net)};
}

FF._optionOf=function(k){
 if(k==="contract"){
  // 계약은 용량이 아니라 사건 노출을 산다. 최근 못 판 수요가 신호다.
  var H=FF.histOf().slice(-3), m=0, d=0;
  for(var i=0;i<H.length;i++){m+=H[i].missed;d+=H[i].dem}
  var owned=(FF.plant().buys.contract||0)>0;
  var M=FF.marketOf();
  var opts=FF.C.contract.options;
  var big=opts[opts.length-1];
  return {kind:k,cost:big.price,limit:big.x,options:opts,
   supply:M?M.si:1, demand:M?M.di:1,
   missRate:d>0?m/d:0,window:H.length,stock:FF.inventory(),owned:owned,
   usable:Math.max(0,FF.C.days-FF.run().day),
   affordable:!owned&&FF.ledger().cash>=opts[1].price,
   payback:null,hits:0,lastHit:false,overRun:false};
 }
 var h=FF.capHits(k,5), off=FF.buyOffset(k);
 var usable=Math.max(0,FF.C.days-FF.run().day-off);
 var be=FF.breakEven(k);
 var payback=be?(be.t/FF.C.step[k]):null;
 return{kind:k,cost:FF.C.cost[k],hits:h.n,window:h.len,lastHit:!!h.last,
  usable:usable,payback:payback,
  affordable:FF.ledger().cash>=FF.C.cost[k],
  overRun:(payback!==null&&payback>usable)};
}


FF.hindsight=FF.memo(FF._hindsight);
FF.missedOps=FF.memo(FF._missedOps);
FF.modContrib=FF.memo(FF._modContrib);
FF.recoverPct=FF.memoBy(FF._recoverPct);
FF.breakEven=FF.memoBy(FF._breakEven);
FF.optionOf=FF.memoBy(FF._optionOf);

// 기회 분석 표: 날짜 x 설비 2차원.
// 각 칸은 그날 그 설비를 하나 더 샀을 때의 가치와 전날 대비 차분을 담는다.
// flat 은 차분이 유지비와 같다는 뜻이다.

FF._hindsightRef=function(){
 var XS=FF.C.contract.options.map(function(o){return o.x});
 var base=FF.replay(FF.run().seed,0,0),best={i:0,s:0,v:base};
 for(var k=0;k<XS.length;k++)for(var s2=0;s2<=5;s2++){
  var v=FF.replay(FF.run().seed,XS[k],s2);
  if(v>best.v)best={i:XS[k],s:s2,v:v};
 }
 return{base:base,best:best,
   mine:FF.replay(FF.run().seed,FF.myContractSize(),FF.plant().buys.sales)};
}

// 사후 기준 계획. 계약 여부와 판매 증설 횟수의 조합이다.
FF._missedOpsRef=function(){
 var full={};
 for(var i=0;i<FF.logOf().mods.length;i++)full[FF.logOf().mods[i].day]=FF.logOf().mods[i].kind;
 var base=FF.replayPlan(FF.run().seed,full);
 var out=[];
 for(var day=2;day<=FF.C.days-2;day++){
  if(full[day])continue;
  var kinds=["sales"];
  for(var k=0;k<kinds.length;k++){
   var p={};for(var dd in full)p[dd]=full[dd];
   p[day]=kinds[k];
   out.push({day:day,kind:kinds[k],gain:Math.round(FF.replayPlan(FF.run().seed,p)-base)});
  }
 }
 out.sort(function(a,b){return b.gain-a.gain});
 return out;
}

FF._modContribRef=function(){
 if(!FF.logOf().mods.length)return null;
 var full={};
 for(var i=0;i<FF.logOf().mods.length;i++)full[FF.logOf().mods[i].day]=FF.logOf().mods[i].kind;
 var baseCash=FF.replayPlan(FF.run().seed,full);
 var out=[];
 for(var j=0;j<FF.logOf().mods.length;j++){
  var p={};
  for(var d in full)if(+d!==FF.logOf().mods[j].day)p[d]=full[d];
  out.push(Math.round(baseCash-FF.replayPlan(FF.run().seed,p)));
 }
 return out;
}

})(window.FF,window.FV);
</script>
<script id="src-report-data">
(function(FF,FV){

FF.cnt=function(axis,val){
 var k=axis===0?"si":"di",n=0;
 for(var i=0;i<FF.histOf().length;i++)if(FF.histOf()[i][k]===val)n++;
 return n;
}

FF.dwellMedian=function(win){
 var h=FF.histOf().slice(-(win||7));
 var arr=[],tot=0;
 for(var i=0;i<h.length;i++){var m=h[i].ageMix||[];
  for(var j=0;j<m.length;j++){arr.push(m[j]);tot+=m[j].q}}
 if(tot<FF.C.ui.eps)return null;
 arr.sort(function(a,b){return a.a-b.a});
 var acc=0,med=null,p90=null;
 for(i=0;i<arr.length;i++){acc+=arr[i].q;
  if(med===null&&acc>=tot*0.5)med=arr[i].a;
  if(p90===null&&acc>=tot*0.9){p90=arr[i].a;break}}
 return{med:med,p90:p90,days:h.length};
}

FF.invPerf=function(win){
 var h=FF.histOf().slice(-(win||5));
 if(h.length<2)return null;
 var sold=0,invSum=0,acc=0,loss=0;
 for(var i=0;i<h.length;i++){sold+=h[i].sold;invSum+=h[i].end;acc+=h[i].acc;loss+=h[i].wT;}
 var avgInv=invSum/h.length, avgSold=sold/h.length;
 return{cover:avgSold>0.05?(avgInv/avgSold):null,loss:acc>0.05?(loss/acc):0,days:h.length};
}

FF.causeFacts=function(d){
 if(!d)return null;
 return {b:d.b,capI:d.capI,capS:d.capS,wIcap:d.wIcap,wIstore:d.wIstore,wS:d.wS,
   prod:d.prod,dem:d.dem,missed:d.missed,wIneed:d.wIneed};
}

FF.invStats=function(){
 var p=FF.invPerf(FF.C.ui.recentWin);
 if(!p)return null;
 var dm=FF.dwellMedian(FF.C.ui.dwellWin);
 return {lossPct:Math.round(p.loss*100),med:dm?dm.med:null,p90:dm?dm.p90:null,win:FF.C.ui.dwellWin};
}
FF.capWord=function(v,cap){return v>=cap-FF.C.ui.eps?"at":(v>=cap*FF.C.ui.nearCap?"near":"free")};
FF.storeWord=function(v){var r=v/FF.C.cap.storage;return r>=FF.C.ui.storeFull?"full":(r>=FF.C.ui.storeMid?"mid":"free")};

FF.maintOf=function(k){return FF.C.step[k]*(k==="intake"?FF.C.maint.intake:FF.C.maint.sales)};
FF.lostInflow=function(d){
 if(!d)return null;
 var tot=d.wI+d.wS;
 if(tot<FF.C.ui.eps)return null;
 var byStore=d.wIstore+d.wS, parts=[];
 if(d.wIcap>FF.C.ui.eps)parts.push({cause:"cap",amt:d.wIcap});
 if(byStore>FF.C.ui.eps)parts.push({cause:"store",amt:byStore});
 if(d.wIneed>FF.C.ui.eps)parts.push({cause:"need",amt:d.wIneed});
 return {total:tot,parts:parts};
}

FF.trend3=function(day){
 var h=FF.histOf(), upto=[];
 for(var i=0;i<h.length;i++)if(!day||h[i].day<=day)upto.push(h[i]);
 var last3=upto.slice(-3), cnt={}, best="none", n=0;
 for(var j=0;j<last3.length;j++){
  var k=last3[j].b; cnt[k]=(cnt[k]||0)+1;
  if(cnt[k]>n){n=cnt[k];best=k}
 }
 return best;
}



FF._matrixData=function(){
 var h=FF.histOf();
 if(h.length<2)return null;
 var days=h.slice(-FF.C.ui.matrixDays);
 var FC=(!FF.isOver()&&FF.run().day<=FF.C.days)?FF.C.ui.fcDays:0;
 var SUP=["low","mid","high"], DEM=["weak","mid","strong"];
 var modOn={}, evOn={};
 FF.logOf().mods.forEach(function(m){modOn[m.day]=m.kind});
 FF.logOf().evlog.forEach(function(e){evOn[e.day]=e.b});
 var futPhase=function(idx,W,tl){
  var a=[];
  for(var dd=1;dd<=FC;dd++){
   var v=FF.blur(FF.hor(idx,dd,dd,FF.C,tl)), b=0;
   for(var t=1;t<3;t++)if(v[t]>v[b])b=t;
   a.push(W[b]);
  }
  return a;
 };
 var mk=function(name,group,vals,fut,warn){
  return {name:name,group:group,cells:vals.map(function(v){
   return {code:v, warn:warn?warn(v):false, muted:(v===null)};
  }), future:(fut||[])};
 };
 return {
  days:days.map(function(r){return r.day}), FC:FC,
  left:Math.max(0,FF.C.days-FF.run().day+1), over:FF.isOver(),
  rows:[
   mk("supply","supply",days.map(function(r){return SUP[r.si]}),FC?futPhase(FF.marketOf().si,SUP,FF.tiltOf().supply):null,function(v){return v==="low"}),
   mk("intake","cap",days.map(function(r){return FF.capWord(r.acc,r.capI)}),null,function(v){return v==="at"}),
   mk("storage","store",days.map(function(r){return FF.storeWord(r.end)}),null,function(v){return v==="full"}),
   mk("sales","cap",days.map(function(r){return FF.capWord(r.sold,r.capS)}),null,function(v){return v==="at"}),
   mk("demand","demand",days.map(function(r){return DEM[r.di]}),FC?futPhase(FF.marketOf().di,DEM,FF.tiltOf().demand):null,function(v){return v==="weak"}),
   mk("event","event",days.map(function(r){return evOn[r.day]||null}),null,function(v){return v!==null}),
   mk("mod","kind",days.map(function(r){return modOn[r.day]||null}),null,null)
  ]
 };
}


FF.matrixData=FF.memo(FF._matrixData);

FF.monthOutlook=function(){
 var M=FF.marketOf();
 if(!M)return null;
 var n=FF.C.days, today=FF.run()?Math.min(FF.run().day,n):1;
 var left=n-today+1;
 if(left<3)return null;
 var w=Math.round(left/3), w2=Math.round(left*2/3);
 var spans=[{key:"early",from:today,to:today+w-1},
            {key:"mid",from:today+w,to:today+w2-1},
            {key:"late",from:today+w2,to:n}];
 var row=function(idx,tl){
  return spans.map(function(s){
   // 오늘 국면에서 몇 일 뒤인지로 전이를 돌린다
   return {key:s.key,from:s.from,to:s.to,
     pct:FF.pct(FF.blur(FF.hor(idx,s.from-today+1,s.to-today+1,FF.C,tl)))};
  });
 };
 var T=FF.tiltOf();
 return {days:n, today:today, left:left, supply:row(M.si,T.supply), demand:row(M.di,T.demand)};
}

// 확률 분포를 한 줄 판정으로 바꾼다. 기상청 1개월전망 해석표와 같은 규칙이다.
//   pct = [낮음, 비슷, 높음]
FF.outlookVerdict=function(pct){
 var low=pct[0], mid=pct[1], high=pct[2];
 if(high>=50)return "high";
 if(low>=50)return "low";
 if(mid>=50)return "similar";
 if(high>low)return "mostlyHigh";
 if(low>high)return "mostlyLow";
 return "similar";
}

// 표시용 양자화. 5% 단위로 낮추되 합계 100을 보존한다.
// 최대 나머지 방식이고 동률은 배열 순서로 고정한다.
FF.quantizePct=function(p,step){
 var st=step||5;
 var base=p.map(function(x){return Math.floor(x/st)*st});
 var sum=base.reduce(function(a,b){return a+b},0);
 var order=p.map(function(x,i){return {i:i,rem:x-base[i]}})
   .sort(function(a,b){return (b.rem-a.rem)||(a.i-b.i)});
 for(var k=0;k<(100-sum)/st;k++)base[order[k].i]+=st;
 return base;
}


// 최근 사흘의 최빈 병목. 기록하지 않고 필요할 때 센다.

FF.missedTop=function(){
 var m=FF.missedOps(), pos=m.filter(function(x){return x.gain>0});
 if(!pos.length)return null;
 var top=pos[0];
 var near=pos.filter(function(x){return x.kind===top.kind&&x.gain>=top.gain*FF.C.ui.nearTop});
 var days=near.map(function(x){return x.day}).sort(function(a,b){return a-b});
 return {day:top.day,kind:top.kind,gain:top.gain,spanFrom:days[0],spanTo:days[days.length-1],spread:days.length>1};
}

FF.finAfterTop=function(){
 if(!FF.run().finDay)return null;
 var all=FF.missedOps().filter(function(x){return x.gain>0});
 all.sort(function(a,b){return b.gain-a.gain});
 var aft=all.filter(function(x){return x.day>=FF.run().finDay});
 if(!aft.length)return {kind:null,state:"none"};
 var t=aft[0];
 if(all.length&&all[0].day===t.day&&all[0].kind===t.kind)
  return {state:"same",day:t.day,kind:t.kind,gain:t.gain};
 return {state:"other",day:t.day,kind:t.kind,gain:t.gain};
}

FF.contribRows=function(){
 var c=FF.modContrib()||[];
 return FF.logOf().mods.map(function(m,i){return {day:m.day,kind:m.kind,contrib:c[i]||0}});
}

FF.recoverStats=function(k){
 var r=FF.recoverPct(k);
 if(!r)return null;
 return {val:r.val,prev:r.prev,delta:(r.prev!==null&&r.prev!==r.val)?(r.val-r.prev):null};
}
FF.modRows=function(){
 var C=FF.modContrib();
 return FF.logOf().mods.map(function(m,i){
  var days=m.use.length, ex=(m.extra||0);
  var isC=(m.kind==="contract");
  var step=isC?(m.size||FF.contractOf()):FF.C.step[m.kind];
  var opt=isC?FF.contractOption(step):null;
  var cost=isC?(opt?opt.price:0)
    :(FF.C.cost[m.kind]+days*step*FF.C.maint.sales);
  return {day:m.day,kind:m.kind,size:m.size,days:days,extra:ex,
   fill:days?ex/(days*step):0,
   cost:cost,
   contrib:C?C[i]:0,
   idle:(days>0&&ex<FF.C.ui.eps)};
 });
}

FF.missedGroups=function(){
 var m=FF.missedOps();
 if(!m.length)return null;
 var by={sales:[]};
 m.forEach(function(x){if(by[x.kind])by[x.kind].push(x)});
 var out=[];
 ["sales"].forEach(function(k){
  var arr=by[k].slice().sort(function(a,b){return a.day-b.day});
  if(!arr.length)return;
  var maint=FF.maintOf(k);
  out.push({kind:k,maint:maint,rows:arr.map(function(t,i){
   var d=(i>0)?(t.gain-arr[i-1].gain):null;
   return {day:t.day,gain:t.gain,delta:d,flat:(d!==null&&Math.abs(d-maint)<=2)};
  })});
 });
 return out;
}


FF._chartData=function(){
 var h=FF.histOf();
 if(h.length<3)return null;
 var FC=(!FF.isOver()&&FF.run().day<=FF.C.days)?FF.C.ui.fcDays:0;
 var n=FF.C.days, lastDay=h[h.length-1].day;
 var domain=Math.max(8,Math.min(n,lastDay+FC));
 var mx=1, mxInv=1;
 h.forEach(function(r){mx=Math.max(mx,r.prod,r.sold);mxInv=Math.max(mxInv,r.end)});
 var band=function(idx,means,noiseSd,tl){
  var out=[];
  for(var dd=1;dd<=FC;dd++){
   var v=FF.blur(FF.hor(idx,dd,dd,FF.C,tl));
   var m=v[0]*means[0]+v[1]*means[1]+v[2]*means[2];
   var sd=Math.sqrt(v[0]*Math.pow(means[0]-m,2)+v[1]*Math.pow(means[1]-m,2)+v[2]*Math.pow(means[2]-m,2))+noiseSd;
   out.push({day:Math.min(n,FF.run().day-1+dd),hi:m+sd,lo:Math.max(0,m-sd)});
  }
  return out;
 };
 var TT=FF.tiltOf();
 var supply=FC?band(FF.marketOf().si,FF.C.sm,FF.C.sd,TT.supply):[];
 var demand=FC?band(FF.marketOf().di,FF.C.dm,FF.C.dd,TT.demand):[];
 supply.concat(demand).forEach(function(b){mx=Math.max(mx,b.hi)});
 var dirWord=function(idx,tl){
  var v=FF.blur(FF.hor(idx,1,3,FF.C,tl)), g=Math.round((v[2]-v[0])*100);
  return g>=10?"up":g<=-10?"down":"flat";
 };
 var ctb=FF.isOver()?(FF.modContrib()||[]):null;
 return {
  rows:h, FC:FC, domain:domain, max:mx, maxInv:mxInv,
  nowDay:Math.min(FF.run().day-1,n), labelDay:Math.min(n,FF.run().day),
  supplyBand:supply, demandBand:demand,
  supplyDir:FC?dirWord(FF.marketOf().si,TT.supply):null, demandDir:FC?dirWord(FF.marketOf().di,TT.demand):null,
  events:FF.logOf().evlog.map(function(e){return {day:e.day,b:e.b}}),
  mods:FF.logOf().mods.map(function(m,i){return {day:m.day,kind:m.kind,contrib:ctb?ctb[i]:null}}),
  scored:!!ctb
 };
}

FF._endCardData=function(){
 var h=FF.hindsight(), u=FF.useRate(FF.C.days);
 var mine=Math.round(FF.ledger().cash-h.base), opt=Math.round(h.best.v-h.base);
 var dw=FF.dwellMedian(FF.C.days), lp=FF.invPerf(FF.C.days);
 return {
  bust:FF.isBust(),
  cash:FF.ledger().cash, seed:FF.run().seed,
  vsIdle:mine, vsHindsight:mine-opt,
  baseContract:h.best.i, baseSales:h.best.s,
  buysContract:FF.plant().buys.contract||0, contractSize:FF.myContractSize(), buysSales:FF.plant().buys.sales,
  spent:FF.ledger().spent, salvaged:FF.ledger().salvaged||0,
  inv:FF.inventory(), capIntake:FF.plant().cap.intake, capShipping:FF.plant().cap.sales,
  dwellMed:dw?dw.med:null, dwellP90:dw?dw.p90:null,
  lossPct:lp?Math.round(lp.loss*100):null,
  useIntake:u.intake, useShipping:u.sales,
  demandPhase:[FF.cnt(1,0),FF.cnt(1,1),FF.cnt(1,2)],
  supplyPhase:[FF.cnt(0,0),FF.cnt(0,1),FF.cnt(0,2)]
 };
}

FF.endCardData=FF.memo(FF._endCardData);
FF.chartData=FF.memo(FF._chartData);
FF.missedMatrix=function(){
 var gs=FF.missedGroups();
 if(!gs)return null;
 var kinds=gs.map(function(g){return g.kind});
 var maint={};
 gs.forEach(function(g){maint[g.kind]=g.maint});
 var byDay={};
 gs.forEach(function(g){
  g.rows.forEach(function(r){
   if(!byDay[r.day])byDay[r.day]={day:r.day,cells:{}};
   byDay[r.day].cells[g.kind]={gain:r.gain,delta:r.delta,flat:r.flat};
  });
 });
 var days=Object.keys(byDay).map(Number).sort(function(x,y){return x-y});
 var best={};
 kinds.forEach(function(k){
  var top=null;
  days.forEach(function(d){var c=byDay[d].cells[k];if(c&&(top===null||c.gain>top))top=c.gain});
  best[k]=top;
 });
 return {kinds:kinds,maint:maint,best:best,rows:days.map(function(d){return byDay[d]})};
}

// 전략 비교. 같은 난수열로 여러 전략을 돌려 평균을 낸다.
// 전략은 계획표, 함수, 규칙 배열 무엇이든 된다.

// 계약은 첫날에 크기를 고르는 결정이다. 사후에 어느 크기가 최선이었는지 남긴다.
FF.contractChance=function(){
 if(!FF.isOver())return null;
 var mine=FF.myContractSize();
 var full=FF.currentPlan();
 var XS=FF.C.contract.options.map(function(o){return o.x})
   .filter(function(x){return x!==mine});
 if(!XS.length)return null;
 var vs=XS.map(function(x){
  var p={};for(var d in full)p[d]=full[d];
  if(x>0)p[1]="contract:"+x; else delete p[1];
  return {at:1,plan:p};
 });
 var r=FF.simulate(FF.run().seed,full,vs);
 var best={x:mine,gain:0};
 for(var i=0;i<XS.length;i++){
  var g=Math.round(r.variants[i]-r.base);
  if(g>best.gain)best={x:XS[i],gain:g};
 }
 return {mine:mine,x:best.x,gain:best.gain};
}

// 최근 며칠의 추세. 실시간 화면에서 변화를 읽는 데 쓴다.
FF.recentSeries=function(n){
 var H=FF.histOf().slice(-(n||8));
 return {
  stock:H.map(function(r){return r.end}),
  missed:H.map(function(r){return r.missed}),
  days:H.map(function(r){return r.day})
 };
}

// 판로 현황. 관계와 오늘 배분을 화면이 읽는 형태로 만든다.
FF.channelRows=function(){
 var rel=FF.relOf(), al=FF.allocOf();
 var sum=0;
 if(al)for(var i=0;i<al.length;i++)sum+=al[i];
 return FF.C.channels.map(function(c,i){
  return {key:c.key, rel:rel[i], quota:c.quota, settle:c.settle,
    share:(al&&sum>0)?(al[i]/sum):null,
    price:Math.round(c.price[0]*FF.C.rel.price[rel[i]]),
    cap:Math.round(c.cap*FF.C.rel.cap[rel[i]]),
    floor:(c.key==="fran")?Math.round(c.quota*FF.C.rel.floor[rel[i]]):0};
 });
}

FF.rInt=function(n){return Math.round(n)}
// 오늘 판로가 받을 수 있는 양은 이월 재고뿐 아니라 오늘 입고분도 포함한다.
// 입고는 배분을 정한 뒤에 들어오므로 국면 평균으로 예상치만 낸다. 실제 입고와는 다를 수 있다.
FF.expectedIntake=function(){
 var M=FF.marketOf(), caps=FF.capsOf();
 if(!M||!caps)return 0;
 return FF.rInt(Math.min(FF.C.sm[M.si],caps.intake));
}
// 오늘 판로별 예상 수요 한도. 커널이 world 로 뽑는 값과 같은 공식을 국면 평균으로 대신 쓴다.
// 실제 값은 이것과 다를 수 있다. 화면은 이것으로 미리보기만 만든다.
FF.estChannelDemand=function(i){
 var M=FF.marketOf(); if(!M)return 0;
 var CH=FF.C.channels, R=FF.C.rel, rel=FF.relOf()[i]===undefined?R.start:FF.relOf()[i];
 var totCap=0; for(var k=0;k<CH.length;k++)totCap+=CH[k].cap;
 var cap2=CH[i].cap*R.cap[rel];
 var d0=FF.C.dm[M.di]*CH[i].cap/totCap;
 var fl=CH[i].key==="fran"?CH[i].quota*R.floor[rel]:0;
 return Math.min(cap2,Math.max(d0,fl));
}
// 판로 태도. 정하지 않았으면 기본값이다.
FF.stanceLevel=function(i){
 var s2=FF.stanceOf();
 return (s2&&s2.length===FF.C.channels.length)?s2[i]:FF.C.stance.start;
}
// 한 판로의 태도를 한 단계 돌린다. 다른 판로는 지금 값을 그대로 지킨다.
// 판로 하나의 태도를 직접 정한다. 순환이 아니라 원하는 단계로 바로 간다.
FF.setChannelStance=function(i,level){
 var n=FF.C.channels.length, cur=[];
 for(var k=0;k<n;k++)cur.push(FF.stanceLevel(k));
 cur[i]=level;
 FF.setStance(cur); FF.repaint();
}
FF.clearStance=function(){FF.setStance(null);FF.repaint()}
// 오래된 재고. ttl(부패까지 날수)의 절반을 넘긴 lot 을 오래된 것으로 본다.
FF.oldStock=function(){
 FF.VERSION.value;
 var lots=FF.lotsOf(), th=Math.floor(FF.C.ttl/2), t=0;
 for(var i=0;i<lots.length;i++)if(lots[i].a>=th)t+=lots[i].q;
 return FF.rInt(t);
}
// 오늘 배분 미리보기. 커널과 같은 FF.allocatePool을 평균 수요로 부른다.
// 실제 실행은 같은 함수를 실제 난수 수요로 부르므로 규칙은 같고 입력만 다르다.
FF.stancePlan=function(){
 FF.observe();
 var rows=FF.channelRows(), n=rows.length;
 var levels=rows.map(function(r,i){return FF.stanceLevel(i)});
 var est=rows.map(function(r,i){return FF.rInt(FF.estChannelDemand(i))});
 var inv=FF.inventory(), exp=FF.expectedIntake(), caps=FF.capsOf();
 var totCap=0, i; for(i=0;i<n;i++)totCap+=rows[i].cap;
 var pool=FF.rInt(Math.min(inv+exp,totCap,caps?caps.sales:totCap));
 var preview=FF.allocatePool(pool,est.slice(),levels,rows.map(function(r){return r.quota}));
 // 판로마다 따로 반올림하면 합이 pool을 넘을 수 있다(quantizePct와 같은 문제).
 // 최대 나머지 방식으로 합을 pool 이하로 고정한 뒤에만 반올림한다.
 var rawSum=0; for(i=0;i<n;i++)rawSum+=preview[i];
 var floor=preview.map(function(v){return Math.floor(v+FF.C.ui.zero)});
 var flooredSum=0; for(i=0;i<n;i++)flooredSum+=floor[i];
 var target=Math.min(pool,Math.round(rawSum));
 var order=preview.map(function(v,idx){return {i:idx,rem:v-floor[idx]}})
   .sort(function(a,b){return (b.rem-a.rem)||(a.i-b.i)});
 var give=Math.max(0,target-flooredSum);
 for(var k=0;k<give&&k<n;k++)floor[order[k].i]+=1;
 preview=floor;
 var sum=0; for(i=0;i<n;i++)sum+=preview[i];
 // 기회비용: 주문은 있는데 다른 판로 우선 때문에 못 받는 양이다.
 var missed=est.map(function(e,idx){return FF.rInt(Math.max(0,e-preview[idx]))});
 return {rows:rows,levels:levels,est:est,preview:preview,missed:missed,inv:FF.rInt(inv),exp:exp,
  pool:pool,sum:FF.rInt(sum)};
}
// 회복 가능성. "가능"은 오늘 보장으로 두면 쿼터를 채울 수 있다는 뜻이다. 확정이 아니라 오늘 조건 판정이다.
FF.issueFeasible=function(i){
 var left=FF.C.days-FF.dayOf();
 if(left<FF.C.rel.up)return "low";
 return FF.estChannelDemand(i)>=FF.C.channels[i].quota-FF.C.ui.zero?"ok":"hard";
}
// 화면이 그릴 신호와 이슈. 도메인 규칙은 여기 없다. 코드값만 옮긴다.
// 당일 결과. 판로별 판매량과 매출과 관계 변화를 하루 실행 직후 보여준다.
FF.dayChannelResult=function(){
 FF.observe();
 var h=FF.histOf();
 if(!h.length)return null;
 var today=h[h.length-1], prev=h.length>1?h[h.length-2]:null;
 var relBefore=prev?prev.rel:FF.C.channels.map(function(){return FF.C.rel.start});
 return FF.C.channels.map(function(c,i){
  var sold=today.toCh?today.toCh[i]:0, rev=today.revCh?today.revCh[i]:0;
  var relTo=today.rel?today.rel[i]:FF.C.rel.start, relFrom=relBefore[i];
  return {key:c.key,sold:FF.rInt(sold),revenue:Math.round(rev),
   relFrom:relFrom,relTo:relTo,changed:relTo!==relFrom};
 });
}
// 사건 이력. 지금까지 발생한 관계 신호를 그대로 돌려준다. 화면 문구는 여기 없다.
FF.relLogOf=function(){FF.VERSION.value;return FF.RUN.value?FF.logOf().relLog:[]}
// 관계 포트폴리오 복기. 판로마다 이번 판 전체의 관계 경로를 낸다.
FF.relPortfolio=function(){
 FF.observe();
 var h=FF.histOf();
 return FF.C.channels.map(function(c,i){
  var series=h.map(function(row){return row.rel?row.rel[i]:FF.C.rel.start});
  return {key:c.key,series:series,final:series.length?series[series.length-1]:FF.C.rel.start};
 });
}
// 판로별 누적 판매와 매출. 하루치가 아니라 이번 판 전체 합이다.
FF.channelTotals=function(){
 FF.observe();
 var h=FF.histOf(), n=FF.C.channels.length, sold=[], rev=[];
 for(var i=0;i<n;i++){sold.push(0);rev.push(0)}
 for(var d=0;d<h.length;d++)for(i=0;i<n;i++){
  sold[i]+=h[d].toCh?h[d].toCh[i]:0;
  rev[i]+=h[d].revCh?h[d].revCh[i]:0;
 }
 return FF.C.channels.map(function(c,i){return {key:c.key,sold:FF.rInt(sold[i]),revenue:Math.round(rev[i])}});
}
// 관계 전환점. 언제 무엇이 바뀌었고 그날 어떤 태도를 두고 있었는지 남긴다.
FF.relTimeline=function(){
 FF.observe();
 var log=FF.relLogOf(), h=FF.histOf();
 return log.map(function(s){
  var row=null;
  for(var d=0;d<h.length;d++)if(h[d].day===s.day){row=h[d];break}
  var level=(row&&row.stance)?row.stance[s.i]:FF.C.stance.start;
  return {type:s.type,i:s.i,day:s.day,from:s.from,to:s.to,level:level};
 });
}
// 주요 결정 복기. 판로 태도가 바뀐 날마다 전후와 그날 관계를 남긴다.
FF.policyChanges=function(){
 FF.observe();
 var h=FF.histOf(), out=[], prev=null;
 for(var d=0;d<h.length;d++){
  var st=h[d].stance||[];
  if(prev){
   for(var i=0;i<FF.C.channels.length;i++){
    if(st[i]!==prev[i])out.push({day:h[d].day,i:i,from:prev[i],to:st[i],relAfter:h[d].rel[i]});
   }
  }
  prev=st;
 }
 return out;
}
FF.issuePlan=function(){
 FF.observe();
 var issues=FF.issueOf(), rel=FF.relOf();
 var P=FF.stancePlan();
 var openList=[];
 for(var i=0;i<issues.length;i++){
  if(!issues[i])continue;
  openList.push({i:i,since:issues[i].since,resolution:issues[i].resolution,
   days:FF.dayOf()-issues[i].since,rel:rel[i],feasible:FF.issueFeasible(i),
   level:P.levels[i],preview:P.preview[i],quota:P.rows[i].quota});
 }
 return {signals:FF.signalOf(),issues:openList};
}
// 이슈를 의도적 포기로 표시한다. 게임 규칙은 바뀌지 않는다. 화면 상태만 바뀐다.
FF.acceptIssue=function(i){
 var issues=FF.issueOf().slice();
 if(issues[i])issues[i]={since:issues[i].since,resolution:"accepted"};
 FF.setIssue(issues); FF.repaint();
}
})(window.FF,window.FV);
</script>
<script id="src-debug">
(function(FF,FV){
window.ffStep=function(state,cmd,world){return FF.step(state,cmd,world)};
window.ffCompare=function(seeds,strategies){return FF.compareStrategies(seeds,strategies)};
window.ffHindRef=function(){return FF._hindsightRef()};
window.ffContribRef=function(){return FF._modContribRef()};
window.ffMissedRef=function(){return FF._missedOpsRef()};
window.ffFinish=function(){
 if(!FF.run().finDay)return{운영종료:false};
 var m=FF.missedOps().filter(function(x){return x.day>=FF.run().finDay});
 var pos=m.filter(function(x){return x.gain>0});
 pos.sort(function(a,b){return b.gain-a.gain});
 var edge=Math.round(FF.ledger().cash-FF.simulate(FF.run().seed,{},[]).base);
 var give=pos.length?pos[0].gain:0;
 return{운영종료일:FF.run().finDay,
  확보우위:edge,
  포기옵션:give,
  포기옵션_위치:pos.length?{일차:pos[0].day,설비:pos[0].kind==="intake"?"입고":"판매"}:null,
  이후_양의기회_수:pos.length,
  종료여유:give>0?+(edge/give).toFixed(2):null};
};

window.ffCheck=function(){
 var bad=[];
 for(var i=0;i<FF.histOf().length;i++){
  var r=FF.histOf()[i];
  var d1=Math.abs((r.prod-r.acc)-(r.wI+r.wS));
  var d2=Math.abs((r.dem-r.sold)-r.missed);
  if(d1>0.001)bad.push({day:r.day,식:"생산=입고+미입고",오차:+d1.toFixed(4)});
  if(d2>0.001)bad.push({day:r.day,식:"수요=판매+못판수요",오차:+d2.toFixed(4)});
 }
 return{검사일수:FF.histOf().length,위반:bad.length,목록:bad};
};

window.ffOption=function(k){var o=FF.optionOf(k);return o};
window.ffTrace=function(){return FF.histOf().map(function(r){
 return{day:r.day,daily:r.b,trend3:FF.trend3(r.day),drift:+(r.acc-r.sold).toFixed(2),
  sold:Math.round(r.sold),missed:Math.round(r.missed),profit:Math.round(r.profit)}})};
window.ffEvents=function(){
 var NAME={intake:"입고 한도",store:"창고 공간",ship:"판매 한도",stock:"판매할 재고"};
 var out=FF.logOf().evlog.map(function(e){
  var bought=FF.logOf().buylog.filter(function(b){return b.day>=e.day&&b.day<=e.day+2});
  return{day:e.day,제약:NAME[e.b]||e.b,
   사건후2일내구매:bought.map(function(b){return b.kind}).join(",")||"없음"};
 });
 var hit=out.filter(function(x){return x.사건후2일내구매!=="없음"}).length;
 return{사건수:out.length,구매로이어짐:hit,
  구매율:out.length?Math.round(hit/out.length*100)+"%":"-",목록:out};
};

window.ffCapSignal=function(){
 var e=FF.logOf().events,out={};
 ["intake","sales"].forEach(function(k){
  var key=k==="intake"?"atCapIntake":"atCapShipping";
  var hits=e.filter(function(x){return x[key]});
  var bought=hits.filter(function(x){return x.bought===k}).length;
  var boughtNoSignal=e.filter(function(x){return x.bought===k&&!x[key]}).length;
  out[k]={상한도달:hits.length,상한직후구매:bought,
   구매율:hits.length?Math.round(bought/hits.length*100):0,
   신호없이구매:boughtNoSignal};
 });
 return out;
};
window.ffModules=function(){
 var contrib=FF.modContrib()||[];
 return FF.logOf().mods.map(function(m,i){
  var u=m.use.length?m.use.reduce(function(a,b){return a+b},0)/m.use.length*100:0;
  var step=m.kind==="intake"?FF.C.step.intake:FF.C.step.sales;
  var ex=m.extra||0, days=m.use.length;
  return{설비:m.kind==="intake"?"입고":"판매",순번:m.idx,구매일:m.day,보유일:days,
   추가용량사용:Math.round(ex),
   여력비율:days?Math.round(ex/(days*step)*100)+"%":"-",
   반사실기여:contrib[i]===undefined?null:contrib[i],
   legacy_이후평균가동:Math.round(u)+"%",
   legacy_구매후3일내상한재도달:m.hit};
 });
};
window.ffBuys=function(){return{sales:FF.plant().buys.sales,contract:FF.plant().buys.contract||0,spent:FF.ledger().spent}};
window.ffAgree=function(){var h=FF.histOf().filter(function(r){return r.day>=3});
 if(!h.length)return 0;return +(h.filter(function(r){return r.b===FF.trend3(r.day)}).length/h.length*100).toFixed(0)};
})(window.FF,window.FV);

<script id="src-text">
(function(FF,FV){
// 오늘 새로 나타난 문제. 짧게 한 줄로 알린다.
FV.EVENT_TEXT={intake:"입고 한도 부족",store:"창고 공간 부족",
 ship:"판매 한도 부족",stock:"팔 재고 부족"};
FV.WORD={
 channel:{online:"온라인",fran:"프랜차이즈",whole:"도매"},
 relword:{0:"끊김",1:"보통",2:"좋음",3:"최상"},
 stance:{0:"양보",1:"기본",2:"우선",3:"보장"},
 signal:{decline:"관계 하락",stuck:"관계 정체",recover:"관계 회복"},
 feasible:{ok:"회복 가능",hard:"현재 회복 곤란",low:"남은 기간상 실익 낮음"},
 policy:{lean:"적게",mid:"보통",full:"넉넉히"},
 verdictSupply:{high:"평년보다 많겠음",mostlyHigh:"평년보다 대체로 많겠음",
   similar:"평년과 비슷하겠음",mostlyLow:"평년보다 대체로 적겠음",low:"평년보다 적겠음"},
 verdictDemand:{high:"평년보다 높겠음",mostlyHigh:"평년보다 대체로 높겠음",
   similar:"평년과 비슷하겠음",mostlyLow:"평년보다 대체로 낮겠음",low:"평년보다 낮겠음"},
 level:{supply:["부족","평년","풍작"],demand:["침체","정상","호황"]},
 span:{early:"초순",mid:"중순",late:"하순"},
 path:{event:"사건",manual:"직접"},
 cap:{at:"한도",near:"근접",free:"여유"},
 store:{full:"가득",mid:"보통",free:"여유"},
 supply:{low:"부족",mid:"평년",high:"풍작"},
 demand:{weak:"침체",mid:"정상",strong:"호황"},
 row:{supply:"생산",intake:"입고",storage:"창고",sales:"판매",demand:"수요",event:"사건",mod:"투자"},
 event:{intake:"입고",store:"창고",ship:"판매",stock:"재고"},
 cause:{cap:"한도",store:"창고 부족",need:"필요 없음"},
 dir:{up:"증가",down:"하락",flat:"보합"}
};
FV.say=function(group,code){
 if(code===null||code===undefined)return "";
 var t=FV.WORD[group];
 return (t&&t[code])||code;
};
// 설비 이름. 화면 어디서나 같은 말을 쓴다.
FV.capName=function(k){return k==="contract"?"초과분 매입 계약":"판매 한도"}
// 지금 한도에서 사고 난 뒤 한도로.
FV.capShift=function(k){
 var c=FF.capsOf(), from=(k==="intake")?c.intake:c.sales;
 return from+" \u2192 "+(from+FF.C.step[k])+"t/일";
}
// 기록과 표에서 쓰는 짧은 이름.
FV.lblOf=function(k){return FV.capName(k)}

FV.p1=function(h){return h.len===0?"관측 없음":(h.last?"막혔다":"여유 있었다")}
FV.p2=function(h){return h.len<3?("관측 "+h.len+"일뿐"):(h.len+"일 중 "+h.n+"일 막힘")}
// 전망 기울기를 월간 전망과 같은 말로 옮긴다.
FV.trendWord=function(gap){
 return gap>=10?"늘어날 전망":(gap<=-10?"줄어들 전망":"큰 변화 없음");
}


FV.worldNote=function(){
 var slump=FF.cnt(1,0),boom=FF.cnt(1,2),poor=FF.cnt(0,0),good=FF.cnt(0,2),n=FF.histLen()||1;
 if(slump/n>=0.5)return "수요 침체가 "+slump+"일 이어져 추가 용량이 팔 자리를 찾기 어려웠다.";
 if(boom/n>=0.5)return "수요 호황이 "+boom+"일 이어져 판매 창구가 성과를 갈랐다.";
 if(poor/n>=0.5)return "생산 부족이 "+poor+"일 이어져 공급망에 들어올 물량 자체가 적었다.";
 if(good/n>=0.5)return "풍작이 "+good+"일 이어져 받아들일 물량은 많았다.";
 return "생산과 수요가 30일 동안 뚜렷한 한쪽으로 기울지 않았다.";
}

// 얼마나 놓쳤는지 숫자로 말한다. 구매 버튼과 같은 어휘를 쓴다.
FV.causeLine=function(d){
 var c=FF.causeFacts(d);
 if(!c)return "아직 관측이 없다";
 var f=function(n){return String(Math.round(n))};
 switch(c.b){
  case "intake": return "하루 입고 한도 "+c.capI+"t을 다 써 "+f(c.wIcap)+"t을 못 받았다";
  case "store":  return "창고가 차서 "+f(c.wIstore+c.wS)+"t을 못 받았다";
  case "supply": return "농가 물량이 "+f(c.prod)+"t뿐이라 입고 한도가 남았다";
  case "ship":   return "하루 판매 한도 "+c.capS+"t을 다 써 "+f(c.missed)+"t을 못 팔았다";
  case "stock":  return "팔 재고가 없어 주문 "+f(c.missed)+"t을 놓쳤다";
  case "demand": return "주문이 "+f(c.dem)+"t뿐이라 판매 한도가 남았다";
  case "policy": return "지금 필요한 만큼만 받아 "+f(c.wIneed)+"t을 남겼다";
 }

<script id="src-ui-flow">
(function(FF,FV){
FV.FlowMetric=function(props){
 return FV._html`
  <div style=${{display:"flex",alignItems:"baseline",gap:"8px"}}>
   <span style=${{width:"30px",fontSize:"12px",color:props.hot?"var(--text-warning)":"var(--text-secondary)"}}>${props.name}</span>
   <span style=${{flex:"1",fontSize:"11px",color:"var(--text-muted)"}}>${props.sub||""}</span>
   <span style=${{fontSize:"15px",fontWeight:"500",color:props.hot?"var(--text-warning)":"var(--text-primary)"}}>${props.value}</span>
  </div>`;
}

FV.SplitBar=function(props){
 var total=props.a+props.b; if(total<=0)total=1;
 var pa=Math.round(props.a/total*100);
 var seg=function(width,bg,fg,label){
  return FV._html`<div style=${{width:width+"%",background:bg,color:fg,textAlign:"center",whiteSpace:"nowrap",overflow:"hidden"}}>${width>=22?label:""}</div>`;
 };
 return FV._html`
  <div style=${{display:"flex",height:"13px",borderRadius:"2px",overflow:"hidden",marginTop:"4px",fontSize:"10px",lineHeight:"13px"}}>
   ${seg(pa,"var(--border-strong)","var(--text-primary)",props.labelA)}
   ${seg(100-pa,"var(--bg-danger)","var(--text-danger)",props.labelB)}
  </div>`;
}

FV.FillBar=function(props){
 var width=Math.min(100,Math.max(1,Math.round(props.value/props.cap*100)));
 return FV._html`
  <div style=${{height:"6px",background:"var(--surface-1)",borderRadius:"3px",overflow:"hidden",marginTop:"4px"}}>
   <div style=${{height:"6px",width:width+"%",background:"var(--text-muted)"}}></div>
  </div>`;
}

FV.FlowConnector=function(props){
 if(!props.visible)return null;
 var width=Math.max(2,Math.round(props.value/props.max*10));
 return FV._html`
  <div style=${{display:"flex",alignItems:"center",gap:"6px",height:"12px",paddingLeft:"38px"}}>
   <div style=${{width:width+"px",height:"12px",background:"var(--border-strong)",opacity:"0.7"}}></div>
   <span style=${{fontSize:"10px",color:"var(--text-muted)"}}>${FF.fInt(props.value)}t</span>
  </div>`;
}

FV.FlowStage=function(props){
 return FV._html`
  <div style=${{padding:"5px 9px",borderLeft:"3px solid "+(props.hot?"var(--border-warning)":"transparent"),background:props.hot?"var(--bg-warning)":"transparent"}}>
   ${props.children}
  </div>
  ${props.note?FV._html`<div style=${{padding:"1px 9px 3px 38px",fontSize:"11px"}}>${props.note}</div>`:null}
  ${props.loss?FV._html`<div style=${{padding:"0 9px 4px 38px",fontSize:"11px",color:"var(--text-danger)"}}>└ ${props.loss}</div>`:null}`;
}

FV.FlowDiagram=function(props){
 var d=props.day;
 var iv=props.inventory;
 var li=FF.lostInflow(d);
 var prod=d?d.prod:0, acc=d?d.acc:0, sold=d?d.sold:0;
 var caps=FF.capsOf();
 var flowMax=Math.max(caps.intake,caps.sales,FF.C.cap.storage);
 var lossText=li?li.parts.map(function(p){return FV.say("cause",p.cause)+" "+FF.fInt(p.amt)}).join(" / "):"";

 var invNote=function(){
  var st=FF.invStats();
  if(!st)return null;
  var dtxt=st.med!==null?("체류 중앙값 "+st.med+"일 · 90% "+st.p90+"일"):"체류 —";
  return FV._html`<span style=${{color:"var(--text-muted)"}}>최근 ${st.win}일 ${dtxt} · 로스 ${st.lossPct}%</span>`;
 };
 var recNote=function(kind){
  var st=FF.recoverStats(kind);
  if(!st)return null;
  return FV._html`
   <span style=${{color:st.val>=0?"var(--text-success)":"var(--text-warning)"}}>이 증설로 현재 ${st.val>=0?"+":""}${mo(st.val)}</span>
   ${st.delta!==null?FV._html`<span style=${{color:"var(--text-muted)"}}> · 전일보다 ${st.delta>=0?"+":""}${mo(st.delta)}</span>`:null}`;
 };

 return FV._html`
  <div style=${{border:"1px solid var(--border)",borderRadius:"var(--radius)",overflow:"hidden"}}>
   <${FV.FlowStage} hot=${!!(d&&d.b==="supply")} loss=${lossText}>
    <${FV.FlowMetric} name="농가" value=${d?FF.fInt(prod)+"t":"—"} hot=${!!(d&&d.b==="supply")} sub=${"매입 "+mo(FF.C.farm)+"원/t"} />
    ${d?FV._html`<${FV.SplitBar} a=${acc} b=${prod-acc} labelA=${"입고 "+FF.fInt(acc)} labelB=${"미입고 "+FF.fInt(prod-acc)} />`:null}
   <//>
   <${FV.FlowConnector} visible=${!!d} value=${acc} max=${flowMax} />

   <${FV.FlowStage} hot=${!!(d&&d.b==="intake")} note=${recNote("intake")}>
    <${FV.FlowMetric} name="입고" value=${d?FF.fInt(acc)+"t":"—"} hot=${!!(d&&d.b==="intake")} sub=${"하루 한도 "+caps.intake+"t"} />
   <//>
   <${FV.FlowConnector} visible=${!!d} value=${acc} max=${flowMax} />

   <${FV.FlowStage} hot=${!!(d&&(d.b==="store"||d.b==="stock"))} note=${invNote()} loss=${(d&&d.wT>FF.C.ui.eps)?("보관 중 상함 "+FF.fInt(d.wT)+"t"):""}>
    <${FV.FlowMetric} name="창고" value=${FF.fInt(iv)+"t"} hot=${!!(d&&(d.b==="store"||d.b==="stock"))} sub=${"용량 "+FF.C.cap.storage+"t"} />
    <${FV.FillBar} value=${iv} cap=${caps.storage} />
   <//>
   <${FV.FlowConnector} visible=${!!d} value=${sold} max=${flowMax} />

   <${FV.FlowStage} hot=${!!(d&&d.b==="ship")} note=${recNote("sales")}>
    <${FV.FlowMetric} name="판매" value=${d?FF.fInt(sold)+"t":"—"} hot=${!!(d&&d.b==="ship")} sub=${"하루 한도 "+caps.sales+"t"} />
   <//>
  </div>`;
}

})(window.FF,window.FV);
</script>

<script id="src-ui-chart">
(function(FF,FV){
FV.ChartLegend=function(props){
 var D=props.data;
 return FV._html`
  <div style=${{fontSize:"11px",color:"var(--text-muted)",marginBottom:"4px"}}>
   <span style=${{color:"var(--text-primary)"}}>━</span> 생산 ·
   <span style=${{color:"var(--text-secondary)"}}>╌</span> 판매 ·
   <span style=${{color:"var(--text-muted)"}}>▮</span> 재고 ·
   <span style=${{color:"var(--text-warning)"}}>●</span>
   ${" 사건(위 유입·중간 창고·아래 유출) · ◆ 증설"+(D.FC>0?" · 오른쪽은 앞으로 "+D.FC+"일 가능 범위":"")}
  </div>`;
};

FV.ChartPlot=function(props){
 var D=props.data;
 if(!D)return null;
 var W=FF.C.chart.w,H=FF.C.chart.h,PAD=FF.C.chart.pad,BH=FF.C.chart.barH,GAP=FF.C.chart.gap;
 var TOP=PAD+20;
 var x=function(day){return PAD+(day-1)/(D.domain-1)*(W-2*PAD)};
 var y=function(v){return TOP+(1-v/D.max)*(H-BH-GAP-PAD-TOP)};
 var bw=(W-2*PAD)/D.domain;

 var inventory=D.rows.map(function(r){
  var hh=Math.max(1,r.end/Math.max(D.maxInv,FF.C.cap.storage)*BH);
  return FV._html`<rect
   x=${(PAD+(r.day-1)*bw).toFixed(1)}
   y=${(H-PAD-hh).toFixed(1)}
   width=${Math.max(1.5,bw*0.8).toFixed(1)}
   height=${hh.toFixed(1)}
   fill="var(--text-muted)" opacity="0.5" />`;
 });

 var forecast=[];
 if(D.FC>0){
  var xNow=x(D.nowDay), lx=x(D.labelDay)+6;
  forecast.push(FV._html`<line
   x1=${xNow.toFixed(1)} y1=${PAD}
   x2=${xNow.toFixed(1)} y2=${(H-BH-GAP-PAD).toFixed(1)}
   stroke="var(--border-strong)" stroke-width="0.7" stroke-dasharray="2 2" />`);
  forecast.push(FV._html`<text x=${lx.toFixed(1)} y=${PAD+7} font-size="7.5" fill="var(--text-primary)">${"생산 "+D.supplyDir}</text>`);
  forecast.push(FV._html`<text x=${lx.toFixed(1)} y=${PAD+16} font-size="7.5" fill="var(--text-secondary)">${"수요 "+D.demandDir}</text>`);
  var whiskers=function(bands,col,dx){
   return bands.map(function(b){
    var px=x(b.day)+dx, y1=y(b.hi), y2=y(b.lo);
    return FV._html`<g>
     <line x1=${px.toFixed(1)} y1=${y1.toFixed(1)} x2=${px.toFixed(1)} y2=${y2.toFixed(1)} stroke=${col} stroke-width="1.4" opacity="0.8" />
     <line x1=${(px-2.5).toFixed(1)} y1=${y1.toFixed(1)} x2=${(px+2.5).toFixed(1)} y2=${y1.toFixed(1)} stroke=${col} stroke-width="1" opacity="0.8" />
     <line x1=${(px-2.5).toFixed(1)} y1=${y2.toFixed(1)} x2=${(px+2.5).toFixed(1)} y2=${y2.toFixed(1)} stroke=${col} stroke-width="1" opacity="0.8" />
    </g>`;
   });
  };
  forecast=forecast.concat(whiskers(D.supplyBand,"var(--text-primary)",-3));
  forecast=forecast.concat(whiskers(D.demandBand,"var(--text-secondary)",3));
 }

 var points=function(key){return D.rows.map(function(r){return x(r.day).toFixed(1)+","+y(r[key]).toFixed(1)}).join(" ")};
 var events=D.events.map(function(e){
  var lane=(e.b==="intake")?0.22:(e.b==="store"||e.b==="stock")?0.5:0.78;
  return FV._html`<circle cx=${x(e.day).toFixed(1)} cy=${(PAD+lane*(H-BH-GAP-2*PAD)).toFixed(1)} r="2.2" fill="var(--text-warning)" />`;
 });
 var mods=D.mods.map(function(m,i){
  var bx=x(m.day);
  var col=D.scored?(m.contrib>=0?"var(--text-success)":"var(--text-warning)"):"var(--text-primary)";
  var ly=(i%2===0)?(PAD+9):(PAD+18), anc="middle", tx=bx;
  if(bx<28){anc="start";tx=PAD}
  else if(bx>W-28){anc="end";tx=W-PAD}
  return FV._html`<g>
   <rect x=${(bx-2.5).toFixed(1)} y=${PAD+1} width="5" height="5" transform=${"rotate(45 "+bx.toFixed(1)+" "+(PAD+3.5)+")"} fill=${col} />
   <line x1=${bx.toFixed(1)} y1=${PAD+6} x2=${bx.toFixed(1)} y2=${H-PAD} stroke=${col} stroke-width="0.5" opacity="0.4" />
   ${D.scored?FV._html`<text x=${tx.toFixed(1)} y=${ly} font-size="7.5" fill=${col} text-anchor=${anc}>${(m.contrib>=0?"+":"")+m.contrib}</text>`:null}
  </g>`;
 });

 return FV._html`<svg viewBox=${"0 0 "+W+" "+H} style=${{width:"100%",height:"auto",display:"block"}}>
  ${inventory}
  ${forecast}
  <polyline points=${points("prod")} fill="none" stroke="var(--text-primary)" stroke-width="1.6" />
  <polyline points=${points("sold")} fill="none" stroke="var(--text-secondary)" stroke-width="1.6" stroke-dasharray="3 2" />
  ${events}
  ${mods}
 </svg>`;
};

FV.ChartAxis=function(props){
 return FV._html`<div style=${{display:"flex",justifyContent:"space-between",fontSize:"10px",color:"var(--text-muted)"}}>
  <span>1일</span><span>${props.domain}일</span>
 </div>`;
};

FV.TimelineChart=function(props){
 var D=props.data;
 if(!D)return null;
 return FV._html`<div>
  <${FV.ChartLegend} data=${D} />
  <${FV.ChartPlot} data=${D} />
  <${FV.ChartAxis} domain=${D.domain} />
 </div>`;
};


// 월간 전망표. 기상청 1개월전망 형식이다.
// 각 구간은 낮음 / 비슷 / 높음 세 확률과 한 줄 판정을 낸다.

// 막대 여덟 칸으로 최근 추세를 보여준다. 숫자보다 방향이 먼저 읽힌다.
FV.Spark=function(props){
 var v=props.values||[];
 if(v.length<2)return null;
 var max=Math.max.apply(null,v.concat([props.floor||1]));
 var BLK=["\u2581","\u2582","\u2583","\u2584","\u2585","\u2586","\u2587","\u2588"];
 var chars=v.map(function(x){
  var i=Math.min(BLK.length-1,Math.max(0,Math.round(x/max*(BLK.length-1))));
  return BLK[i];
 }).join("");
 var head=chars.slice(0,-1), tail=chars.slice(-1);
 return FV._html`
  <div class="spark">
   <span class="spark-name">${props.label}</span>
   <span class="spark-bars">${head}<span class="spark-new" key=${props.day}>${tail}</span></span>
   <span class="spark-now">${props.now}</span>
  </div>`;
}
})(window.FF,window.FV);
</script>

<script id="src-report">
(function(FF,FV){
// 결과 화면 접이식의 열림 상태. 화면에만 쓰이므로 신호가 아니다.
FV.OPEN={};


/* ---- View primitives --------------------------------------------------
 * props: atomic values and display options
 * children: nested UI structure
 * primitives do not know domain concepts and do not calculate game values
 * --------------------------------------------------------------------- */
FV.Panel=function(props){

};

  <section>
   ${p.title?FV._html`<div class="section-title">${p.title}</div>`:null}

  </section>`;
};

FV.StatRow=function(props){

 return FV._html`
  <div class="stat-row">
   <span class="stat-label">${p.label}</span>
   <span class="stat-value">${p.value}</span>
   <span class="stat-note">${p.note||""}</span>
  </div>`;
};

// 접이식. 펼칠 때만 본문을 만든다. render 는 함수다.
// 접이식. 펼칠 때만 본문을 만든다. render 는 함수다.
FV.Fold=function(props){

 var onToggle=function(e){
  var now=!!e.target.open;
  if(now===!!FV.OPEN[id])return;

 };
 return FV._h("details",{class:"fold",open:open,onToggle:onToggle},[
  FV._h("summary",{class:"fold-head","data-fold":id},p.title),
  open?FV._h("div",{class:"fold-body"},[p.render()]):null
 ]);
};



FV.OpportunityCell=function(props){

 var top=(best!==null&&c.gain===best&&c.gain>0);
 var delta=(c.delta===null)?"":(c.flat?"·":((c.delta>=0?"+":"")+mo(c.delta)));
 return FV._html`
  <span style=${{textAlign:"right",whiteSpace:"nowrap"}}>
   <span style=${{color:c.gain>=0?"var(--text-success)":"var(--text-warning)",fontWeight:top?"600":"400"}}>${(c.gain>=0?"+":"")+mo(c.gain)}</span>
   <span style=${{fontSize:"10px",marginLeft:"5px",color:c.flat?"var(--text-muted)":"var(--text-secondary)"}}>${delta}</span>
  </span>`;
};

FV.OpportunityRow=function(props){
